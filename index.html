<script>
(() => {
  const CV = document.getElementById('cv');
  const circle = document.getElementById('circle');
  const summonBtn = document.getElementById('summonBtn');
  const clearBtn = document.getElementById('clearBtn');
  const door = document.getElementById('door');
  const summonFx = document.getElementById('summonFx');
  const fxButterflies = document.getElementById('fxButterflies');
  const DOOR_CLOSE_MS = 550, DOOR_OPEN_MS = 600;
  const SUMMON_AUDIO_DUR = 5.28;   // 召唤.mp3 实测时长，仅作兜底；运行时优先用音频真实 duration
  const reveal = document.getElementById('reveal');
  const reveal10 = document.getElementById('reveal10');
  const luRow = document.getElementById('luRow');
  const seqActions = document.getElementById('seqActions');
  const seqSingle = document.getElementById('seqSingle');
  const againBtn = document.getElementById('againBtn');
  const closeBtn = document.getElementById('closeBtn');
  const againBtn10 = document.getElementById('againBtn10');
  const closeBtn10 = document.getElementById('closeBtn10');
  const againBtnS = document.getElementById('againBtnS');
  const closeBtnS = document.getElementById('closeBtnS');
  const modeSeg = document.getElementById('modeSeg');
  const sceneChars = document.getElementById('sceneChars');
  const sceneName = document.getElementById('sceneName');
  const seqDots = document.getElementById('seqDots');
  const seqProgress = document.getElementById('seqProgress');
  const skipBtn = document.getElementById('skipBtn');
  const srFx = document.getElementById('srFx');
  const srImg = document.getElementById('srImg');
  const srSparks = document.getElementById('srSparks');
  const poolSeg = document.getElementById('poolSeg');
  const doll = document.getElementById('doll');
  const scrollWrap = document.getElementById('scrollWrap');
  const scrollEl = document.getElementById('scrollEl');
  const scrollBody = document.getElementById('scrollBody');
  const loading = document.getElementById('loading');
  const ctx = CV.getContext('2d');

  /* ---------------- 绘制画布 ---------------- */
  let dpr = Math.max(1, window.devicePixelRatio || 1);
  let W=0, H=0;
  let strokes = [], current = null;
  let color = '#ffe9a8';
  const lineW = 4;

  function resize(){
    const r = circle.getBoundingClientRect();
    W = r.width; H = r.height;
    CV.width = W*dpr; CV.height = H*dpr;
    CV.style.width = W+'px'; CV.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    redraw();
  }
  window.addEventListener('resize', resize);

  document.querySelectorAll('.swatch').forEach(s=>{
    s.addEventListener('click', ()=>{
      document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('on'));
      s.classList.add('on');
      color = s.dataset.color;
    });
  });

  function pos(e){
    const r = CV.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function start(e){
    e.preventDefault();
    if(current) return;                       // 防止 touch+mouse 双触发导致重复起播
    current = { color, points:[pos(e)] };
    strokes.push(current);
    playDrawSound();                          // 落笔即从头播绘制音效（中途再画则再从头放一遍）
  }
  function move(e){
    if(!current) return;
    e.preventDefault();
    const p = pos(e);
    const last = current.points[current.points.length-1];
    if(Math.hypot(p.x-last.x, p.y-last.y) < 1.2) return;
    current.points.push(p);
    seg(current);
  }
  // 抬笔只结束当前笔画，不再切断绘制音效——让它自然放完；新一次落笔会从头重播
  function end(){ current = null; }

  function seg(s){
    const pts = s.points;
    if(pts.length < 2) return;
    const a = pts[pts.length-2], b = pts[pts.length-1];
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle = s.color; ctx.shadowColor = s.color; ctx.shadowBlur = 18;
    ctx.lineWidth = lineW;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    ctx.shadowBlur = 8; ctx.lineWidth = 1.6; ctx.strokeStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  function redraw(){
    ctx.clearRect(0,0,W,H);
    for(const s of strokes){
      if(s.points.length < 2) continue;
      ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.strokeStyle=s.color; ctx.shadowColor=s.color; ctx.shadowBlur=18; ctx.lineWidth=lineW;
      ctx.beginPath(); ctx.moveTo(s.points[0].x, s.points[0].y);
      for(let i=1;i<s.points.length;i++) ctx.lineTo(s.points[i].x, s.points[i].y);
      ctx.stroke();
      ctx.shadowBlur=8; ctx.lineWidth=1.6; ctx.strokeStyle='#ffffff';
      ctx.beginPath(); ctx.moveTo(s.points[0].x, s.points[0].y);
      for(let i=1;i<s.points.length;i++) ctx.lineTo(s.points[i].x, s.points[i].y);
      ctx.stroke();
    }
  }

  CV.addEventListener('mousedown', start);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  CV.addEventListener('touchstart', start, {passive:false});
  CV.addEventListener('touchmove',  move,  {passive:false});
  CV.addEventListener('touchend',   end);
  CV.addEventListener('mouseleave', end);

  clearBtn.addEventListener('click', ()=>{ strokes=[]; redraw(); });

  /* ---------------- 模式 / 数据 ---------------- */
  let mode = 'single';

  /* ---------------- 抽卡池（蓝票 / 破碎符咒 / 十周年特别版） ----------------
     概率配置在 rates.json 的 "pools" 段：每个池子单独一套稀有度权重，
     池子里没写的稀有度沿用 rarities 的权重，改文件刷新即生效。 */
  const POOL_KEY = 'onmyoji_pool_v1';
  const POOLS = ['蓝票', '破碎符咒'];
  let pool = POOLS[0];
  try{ const s = localStorage.getItem(POOL_KEY); if(POOLS.includes(s)) pool = s; }catch(e){}

  /** 还没上线的限时UP 角色不放进任何卡池（到点后自动进池，见 scheduleUpRelease） */
  function drawRoster(){
    if(upStarted()) return roster;
    const out = {};
    for(const k of Object.keys(roster || {}))
      out[k] = (roster[k] || []).filter(c => c.id !== UP_POOL.charId);
    return out;
  }

  function buildTiersFor(name){
    const ov  = (rates && rates.pools && rates.pools[name]) || {};
    const src = (rates && rates.rarities) || {};
    const rarities = {};
    for(const k of Object.keys(src)){
      rarities[k] = { ...src[k], weight: (k in ov) ? ov[k] : src[k].weight };
    }
    return Gacha.buildTiers(drawRoster(), { ...rates, rarities });
  }

  /* ---------------- 十周年特别版（仅一次） ----------------
     首次进入时召唤按钮变成「十周年特别版」：期间底部 UI 锁定为 十连 + 蓝票
     （玩家点不动），实际抽卡固定为十连抽 + pools."十周年" 的概率；
     点过一次（本地记忆）后解锁，按钮永久还原为普通「开始抽卡」。 */
  const TENTH_KEY  = 'onmyoji_10th_v1';
  const TENTH_POOL = '十周年';
  let tenthUsed = false;
  try{ tenthUsed = localStorage.getItem(TENTH_KEY) === '1'; }catch(e){}

  function paintSummonBtn(){
    if(!tenthUsed){
      summonBtn.textContent = '十周年特别版召唤';
      summonBtn.classList.add('tenth');
    }else{
      summonBtn.classList.remove('tenth');
      summonBtn.textContent = mode === 'ten' ? '开 始 十 连' : '开始抽卡';
    }
  }

  /** 十周年期间锁定显示 十连+蓝票；消耗后恢复玩家自己的选择。
      四池互斥：选中 UP 池时 poolSeg 两个常规按钮都不亮，由 upChip 状态牌表明当前池子。 */
  const upChip = document.getElementById('upChip');
  function paintSegs(){
    const lock = !tenthUsed;
    modeSeg.classList.toggle('locked', lock);
    poolSeg.classList.toggle('locked', lock);
    const wantMode  = lock ? 'ten'   : mode;
    const wantPool  = lock ? POOLS[0] : pool;
    modeSeg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.mode === wantMode));
    poolSeg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.pool === wantPool));
    const isUp = (pool === UP_POOL.key || pool === PICK_POOL.key);
    upChip.hidden = !isUp;
    if(isUp) upChip.textContent = (pool === UP_POOL.key ? '限时UP' : '自选UP') + ' · 使用中';
  }

  modeSeg.addEventListener('click', e=>{
    if(!tenthUsed) return;                       // 十周年期间锁定
    const b = e.target.closest('button[data-mode]');
    if(!b) return;
    mode = b.dataset.mode;
    modeSeg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    paintSummonBtn();
  });

  poolSeg.addEventListener('click', e=>{
    if(!tenthUsed) return;                       // 十周年期间锁定
    const b = e.target.closest('button[data-pool]');
    if(!b) return;
    pool = b.dataset.pool;
    selUpTab = null;                             // 选常驻池 → 自动取消限时/自选的选中态
    try{ localStorage.setItem(POOL_KEY, pool); }catch(err){}
    paintSegs();
    updateUpSelUI();
    if(roster && Object.keys(roster).length) tiers = buildTiersFor(pool);
  });

  let tiers = [];
  let roster = {}, rates = {};

  /* ---------------- 卡池弹窗（常驻/自选/限时）+ UP 池规则 ----------------
     抽卡规则（pool === 两个 UP 池 key 时生效，见 drawUpPool）：
       · 基础概率其余不变（rates.json pools 对应键，SSR/SP 已按蓝票 ×2.5）；
       · 每 60 抽必得任意一个 SSR/SP（upStates[id].since 计数，硬保底）；
       · 抽中 SSR/SP 时按 UP 概率判定是否变为 UP 角色：
         初始 10%，60抽起 12% → 120:14% → 180:18% → 240:25% → 300:40%
         → 360:55% → 420:80% → 450:100%（按 upStates[id].count 阶梯取档）。
     限时=百羽凤凰火（固定角色）；自选=同一套规则，角色由玩家在弹窗里选（SSR/SP）。 */
  const UP_LADDER = [[60,12],[120,14],[180,18],[240,25],[300,40],[360,55],[420,80],[450,100]];
  const UP_PITY   = 60;             // 每 60 抽必得任意 SSR/SP
  const UP_POOL = {
    tab: 'limited',
    key: '百羽凤凰火UP',            // rates.json pools 对应键
    title: '百羽凤凰火限时UP',
    img: 'img/sp/51百羽凤凰火.png',
    charId: 'sp/百羽凤凰火.png',    // UP 角色 id（roster 里的 id）
    baseRate: 10,                   // 初始 UP 概率 %
    upRate: '10%',                  // 弹窗文案：SP百羽凤凰火概率UP xx%
    /* 上线时间：北京时间 2026-09-07 23:00。带 +08:00 偏移，换设备/换时区也不会算错。
       没到点：页签锁定不可选、「选择卡池」拦一道、抽卡兜底走普通池（见 upStarted）。 */
    startsAt: '2026-09-09T09:00:00+08:00',   // 北京时间 2026-09-09 09:00 开池
    endsAt: '2026-09-30T23:59:59',  // 本地时区
  };
  const PICK_POOL = {
    tab: 'pick',
    key: '自选UP',
    title: '自选概率UP',
    baseRate: 10,
    upRate: '10%',
    endsAt: UP_POOL.endsAt,         // 与限时同周期
  };
  const UP_DEFS = { limited: UP_POOL, pick: PICK_POOL };
  const UP_MAX = UP_LADDER[UP_LADDER.length - 1][0];   // 进度条满格抽数
  const UPSTATE_KEY = 'onmyoji_up_state_v2';   // 两个 UP 池各自的 累计抽数 + 距上次 SSR/SP 抽数
  /* ---- 限时UP 上线时间门控 ----
     北京时间 startsAt 之前：页签锁定（点不动）、「选择卡池」拦一道、抽卡兜底走普通池。
     到点后由 paintUpCountdown 的 15s 心跳自动解锁（弹窗开着也不用刷新页面）。 */
  function upStartMs(){ return new Date(UP_POOL.startsAt).getTime(); }
  function upStarted(){ return Date.now() >= upStartMs(); }
  function isTabLocked(tab){ return tab === 'limited' && !upStarted(); }
  /** x天x时x分 */
  function fmtDur(ms){
    const day = 86400000, hour = 3600000, min = 60000;
    if(!(ms > 0)) ms = 0;
    return `${Math.floor(ms / day)}天${Math.floor((ms % day) / hour)}时${Math.floor((ms % hour) / min)}分`;
  }

  // UP 池不在 POOLS 白名单里（poolSeg 只有两个常规按钮），这里单独恢复持久化的 UP 池选择。
  // 限时UP 还没上线却存着旧选择（比如改过配置 / 改过系统时间）→ 丢掉，回到蓝票。
  try{
    const p = localStorage.getItem(POOL_KEY);
    if(p === UP_POOL.key && !upStarted()){
      try{ localStorage.removeItem(POOL_KEY); }catch(e){}
    }else if(p === UP_POOL.key || p === PICK_POOL.key) pool = p;
  }catch(e){}
  let upStates = { limited: { count: 0, since: 0 }, pick: { count: 0, since: 0 } };
  try{
    const s = JSON.parse(localStorage.getItem(UPSTATE_KEY));
    if(s && s.limited) upStates.limited = s.limited;
    if(s && s.pick)    upStates.pick    = s.pick;
  }catch(e){}
  // 旧版（单池 v1）数据迁移到 limited
  try{
    if(!localStorage.getItem(UPSTATE_KEY)){
      const s1 = JSON.parse(localStorage.getItem('onmyoji_up_state_v1'));
      if(s1 && typeof s1.count === 'number')
        upStates.limited = { count: Math.max(0, s1.count|0), since: Math.max(0, s1.since|0) };
    }
  }catch(e){}
  function saveUpState(){ try{ localStorage.setItem(UPSTATE_KEY, JSON.stringify(upStates)); }catch(e){} }

  /* 自选角色（玩家挑中的概率UP角色，持久化） */
  const PICK_CHAR_KEY = 'onmyoji_pick_char_v1';
  let pickChar = null;            // { id, name, img, rarity }
  try{ const pc = JSON.parse(localStorage.getItem(PICK_CHAR_KEY)); if(pc && pc.id) pickChar = pc; }catch(e){}

  /* 常驻统计：全局抽卡计数（所有池子都累加） */
  const STATS_KEY = 'onmyoji_draw_stats_v1';
  let drawStats = { total: 0, ur: 0, ssr: 0, sp: 0, sr: 0, r: 0, n: 0 };
  try{
    const s = JSON.parse(localStorage.getItem(STATS_KEY));
    if(s) for(const k of Object.keys(drawStats)) if(typeof s[k] === 'number') drawStats[k] = s[k];
  }catch(e){}
  function addDrawStats(list){
    for(const c of (list || [])){
      const r = (c && c.rarity) || 'n';
      drawStats.total++;
      if(r in drawStats) drawStats[r]++;
    }
    try{ localStorage.setItem(STATS_KEY, JSON.stringify(drawStats)); }catch(e){}
  }

  const upWrap   = document.getElementById('upWrap');
  const upBg     = document.getElementById('upBg');
  const upBgImg  = document.getElementById('upBgImg');
  const petalBtn = document.getElementById('petalBtn');
  const upClose  = document.getElementById('upClose');
  const upPick   = document.getElementById('upPick');
  const upProgTip  = document.getElementById('upProgTip');
  const upProgZone = document.getElementById('upProgZone');
  const upScale    = document.getElementById('upScale');
  const upTrack  = document.getElementById('upTrack');
  const upFill   = document.getElementById('upFill');
  const upHandle = document.getElementById('upHandle');
  const upTicks  = document.getElementById('upTicks');
  const upProg   = document.getElementById('upProg');
  const upCur    = document.getElementById('upCur');
  const upStats  = document.getElementById('upStats');
  const upAddBtn = document.getElementById('upAddBtn');
  const upPickImg   = document.getElementById('upPickImg');
  const upPickGuarantee = document.getElementById('upPickGuarantee');
  const upPickRateLine  = document.getElementById('upPickRateLine');
  const upCharList = document.getElementById('upCharList');
  const upCharGrid = document.getElementById('upCharGrid');
  let upTimer = null;
  // 限时UP 没上线时默认落在「自选」页签，别一打开就是看不了的东西
  let upActive = upStarted() ? 'limited' : 'pick';   // 当前页签：limited | pick | perm
  let selUpTab  = null;           // 当前选中的 UP 池页签（null=选的是常驻蓝票/破碎符咒）；三池互斥

  /** 刷新互斥选中态：页签角标 + 「选择卡池」按钮的文字/颜色 */
  function updateUpSelUI(){
    document.querySelectorAll('.up-tab').forEach(b => b.classList.toggle('sel', b.dataset.tab === selUpTab));
    const pickedHere = (upActive === 'perm') ? (pool === '蓝票' && !selUpTab)
                                             : (!!selUpTab && selUpTab === upActive);
    upPick.classList.toggle('done', pickedHere);
    upPick.textContent = pickedHere ? '已选择该卡池 ✓' : '选 择 卡 池';
    updateUpLock();     // 未上线的限时UP：按钮禁用 + 文案改「距上线 x天x时x分」
  }

  /** 页签切换：perm 隐藏进度尺/时间（选择卡池按钮三页签都显示） */
  function switchUpTab(tab){
    upActive = tab;
    document.querySelectorAll('.up-tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    document.querySelectorAll('.up-pane').forEach(p => { p.hidden = (p.dataset.pane !== tab); });
    syncUpBg();   // 背景立绘：限时页签 或 自选页签已选角色时显示
    const isPerm = tab === 'perm';
    upProg.style.display = isPerm ? 'none' : '';
    upPick.style.display = '';
    if(!isPerm){
      layoutUpScale(); paintUpBar(); centerUpPan();
    }
    paintUpCountdown();   // 切页签时同步主按钮的「距上线」倒计时
    if(tab === 'pick') buildUpCharList();
    updateUpSelUI();
  }
  /** 限时UP 未上线：页签照常能点进来看，但「选择卡池」按钮禁用，
      按钮文字直接显示「距上线 x天x时x分」（文本由 paintUpCountdown 维护） */
  let upLaunchCd = '';   // 最新「距上线」倒计时文案；空串 = 已上线
  function updateUpLock(){
    const locked = upActive === 'limited' && !upStarted();
    upPick.disabled = locked;
    upPick.title = locked ? '限时UP 尚未上线，不可选择' : '';
    if(locked) upPick.textContent = upLaunchCd || '距上线 --天--时--分';
    try{
      petalBtn.title = upStarted() ? '百羽凤凰火 限时UP卡池' : '百羽凤凰火 限时UP卡池（未上线）';
    }catch(e){}
  }
  document.querySelectorAll('.up-tab').forEach(b => b.addEventListener('click', () => switchUpTab(b.dataset.tab)));
  paintUpCountdown();   // 进页面先算一次锁定态与「距上线」，不用等弹窗打开

  /** 到点自动「开池」：UP 角色进池 + 重建 tiers + 解开「选择卡池」+ 自选列表把它加回来。
      页面开着跨过上线时间也不用刷新（setTimeout 上限约 24.8 天，够用）。 */
  function scheduleUpRelease(){
    const wait = upStartMs() - Date.now();
    if(!(wait > 0)) return;
    setTimeout(()=>{
      if(roster && Object.keys(roster).length) tiers = buildTiersFor(pool);
      if(charListBuilt){ charListBuilt = false; upCharGrid.innerHTML = ''; }  // 自选列表重算
      paintUpCountdown();
      updateUpSelUI();
    }, Math.min(wait + 800, 2147483647));
  }
  scheduleUpRelease();

  function openUpModal(){
    upWrap.classList.add('on');
    upWrap.setAttribute('aria-hidden', 'false');
    // 定位到当前使用中的卡池页签，保证进度/保底/概率提示与实际抽卡数据同步
    switchUpTab(UP_TAB_BY_POOL[pool] || upActive);
    paintUpCountdown();
    if(!upTimer) upTimer = setInterval(paintUpCountdown, 15000);
  }
  function closeUpModal(){
    upWrap.classList.remove('on');
    upWrap.setAttribute('aria-hidden', 'true');
    if(upTimer){ clearInterval(upTimer); upTimer = null; }
  }
  petalBtn.addEventListener('click', openUpModal);
  upChip.addEventListener('click', openUpModal);   // 主界面 UP 状态牌 → 打开弹窗查看
  upClose.addEventListener('click', closeUpModal);
  upWrap.addEventListener('click', e=>{ if(e.target === upWrap) closeUpModal(); });

  /** 当前抽数对应的 UP 概率（阶梯取档，初始 baseRate） */
  function upRateAt(count){
    let r = UP_POOL.baseRate;
    for(const [n, v] of UP_LADDER){ if(count >= n) r = v; }
    return r;
  }

  /* 进度条：整条「刻度尺」比可视窗口宽，左右拖动平移查看各档；
     滑块/进度钉在尺子上、始终代表玩家真实数据，不可拖。 */
  const UP_PAD_L = 10, UP_PAD_R = 22;   // 轨道/刻度在尺子两端的内缩（与 CSS 一致）
  const UP_TW = () => Math.max(1, upScale.offsetWidth - UP_PAD_L - UP_PAD_R);   // 轨道宽
  function layoutUpScale(){
    const zoneW = upProgZone.clientWidth || 300;
    // 尺子宽度：至少铺满可视区；每 60 档间距 ≥64px，保证相邻刻度文字不重叠
    upScale.style.width = Math.max(zoneW, Math.ceil(UP_MAX / 60 * 64)) + 'px';
  }
  /** 把尺子平移到可视范围内（带钳制） */
  function applyUpPan(){
    const max = Math.max(0, upScale.offsetWidth - upProgZone.clientWidth);
    upPan = Math.max(0, Math.min(upPan, max));
    upScale.style.transform = `translateX(${-upPan}px)`;
    paintUpCur();   // 气泡钉在滑块上方，跟随尺子平移保持可见
  }
  /** 「当前抽数」气泡：悬在金色滑块正上方；拖动/平移时钳制在可视窗口内 */
  function paintUpCur(){
    if(!upCur) return;
    const st = upStates[upActive] || upStates.limited;
    const x = UP_PAD_L + Math.min(st.count / UP_MAX, 1) * UP_TW();
    upCur.textContent = st.count + ' 抽';
    const bw = upCur.offsetWidth || 40;
    const cx = Math.max(upPan + bw / 2 + 2, Math.min(x, upPan + upProgZone.clientWidth - bw / 2 - 2));
    upCur.style.left = cx + 'px';
  }
  function paintUpBar(){
    const st   = upStates[upActive] || upStates.limited;
    const frac = Math.min(st.count / UP_MAX, 1);
    const x = UP_PAD_L + frac * UP_TW();
    upFill.style.width   = (x - UP_PAD_L) + 'px';
    upHandle.style.left  = x + 'px';
    paintUpCur();
    const next = UP_LADDER.find(([n]) => st.count < n);
    upProgTip.textContent = `当前UP概率 ${upRateAt(st.count)}%` +
      (next ? ` · ${next[0]}次后提升至${next[1]}%` : ' · 已达最高');
    paintGuarantees();
    paintPickLine();
  }
  /** 「xx次召唤内必得 SSR/SP」跟实时保底计数走：显示距必得还剩几次 */
  function paintGuarantees(){
    document.getElementById('upGuarantee').textContent =
      `${Math.max(0, UP_PITY - upStates.limited.since)}次召唤内必得`;
    upPickGuarantee.textContent =
      `${Math.max(0, UP_PITY - upStates.pick.since)}次召唤内必得`;
  }
  /** 自选页签的 UP 行：随选中角色与当前档位刷新 */
  function paintPickLine(){
    const rate = upRateAt(upStates.pick.count);
    if(pickChar){
      const m = Gacha.rarityMeta(rates, pickChar.rarity || 'ssr');
      upPickRateLine.innerHTML = `${m.label}${pickChar.name} 概率UP <b>${rate}%</b>`;
    }else{
      upPickRateLine.innerHTML = `点击「＋」选择概率UP角色 <b>${rate}%</b>`;
    }
  }
  /** 打开弹窗时把尺子平移到玩家当前抽数附近 */
  function centerUpPan(){
    const st = upStates[upActive] || upStates.limited;
    const zoneW = upProgZone.clientWidth;
    const x = UP_PAD_L + Math.min(st.count / UP_MAX, 1) * UP_TW();
    upPan = x - zoneW / 2;
    applyUpPan();
  }

  /* 尺子平移（横向，鼠标/触摸） */
  let upPan = 0, upPanDrag = null;
  function upPanStart(e){
    upPanDrag = { startX: (e.touches ? e.touches[0].clientX : e.clientX), startPan: upPan };
  }
  function upPanMove(e){
    if(!upPanDrag) return;
    if(e.cancelable) e.preventDefault();
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    upPan = upPanDrag.startPan - (x - upPanDrag.startX);
    applyUpPan();
  }
  function upPanEnd(){ upPanDrag = null; }
  upProgZone.addEventListener('mousedown', upPanStart);
  window.addEventListener('mousemove', upPanMove);
  window.addEventListener('mouseup',    upPanEnd);
  upProgZone.addEventListener('touchstart', upPanStart, { passive:false });
  upProgZone.addEventListener('touchmove',  upPanMove,  { passive:false });
  upProgZone.addEventListener('touchend',   upPanEnd);
  upProgZone.addEventListener('touchcancel',upPanEnd);
  window.addEventListener('resize', ()=>{ layoutUpScale(); paintUpBar(); applyUpPan(); });

  // 刻度：60~450 每档抽数 + 对应UP概率
  (function buildUpTicks(){
    for(const [n, r] of UP_LADDER){
      const t = document.createElement('div');
      t.className = 'up-tick';
      t.style.left = (n / UP_MAX * 100) + '%';
      t.innerHTML = `<b>${n}</b><i>${r}%</i>`;
      upTicks.appendChild(t);
    }
  })();

  /** 限时UP 未上线：主按钮倒计时「距上线 x天x时x分」（15s 心跳 + 切页签时刷新）。
      上线后由 scheduleUpRelease / updateUpSelUI 把按钮恢复为「选 择 卡 池」。 */
  function paintUpCountdown(){
    const now = Date.now(), start = upStartMs();
    upLaunchCd = now < start ? '距上线 ' + fmtDur(start - now) : '';
    updateUpLock();                                  // 到点了就在这里自动解锁按钮
  }

  /* ---------------- UP 池抽卡规则（限时/自选 共用一套，状态各自独立） ---------------- */

  /** UP 池 tiers：normal=完整池（SSR/SP 已 ×2.5），forced=只保留 SSR/SP（60抽保底用） */
  function buildUpTiers(forced, poolKey){
    const ov  = (rates && rates.pools && rates.pools[poolKey]) || {};
    const src = (rates && rates.rarities) || {};
    const rarities = {};
    for(const k of Object.keys(src)){
      let w = (k in ov) ? ov[k] : src[k].weight;
      if(forced && k !== 'ssr' && k !== 'sp') w = 0;
      rarities[k] = { ...src[k], weight: w };
    }
    return Gacha.buildTiers(drawRoster(), { ...rates, rarities });
  }

  function findCharById(id){
    for(const k of Object.keys(roster || {})){
      const hit = (roster[k] || []).find(c => c.id === id);
      if(hit) return hit;
    }
    return null;
  }

  /** id 抽取：tabId 'limited' | 'pick'。返回本批角色卡片数组 */
  function drawUpPool(tabId, n){
    if(tabId === 'limited' && !upStarted()) return Gacha.draw(tiers, n);   // 未上线兜底：按普通池抽
    const def = UP_DEFS[tabId] || UP_POOL;
    const upChar = (tabId === 'limited') ? findCharById(UP_POOL.charId)
                 : (pickChar ? findCharById(pickChar.id) : null);
    if(!upChar) return Gacha.draw(tiers, n);          // 兜底：自选还没选角色 / 找不到 UP 角色按普通池抽
    // 还没上线的 UP 角色（比如被存成了自选角色）：按普通池抽，不提前放出来
    if(!upStarted() && upChar.id === UP_POOL.charId) return Gacha.draw(tiers, n);
    const st   = upStates[tabId];
    const m    = Gacha.rarityMeta(rates, upChar.rarity || 'sp');
    const tN   = buildUpTiers(false, def.key);
    const tF   = buildUpTiers(true,  def.key);
    const out  = [];
    for(let i = 0; i < n; i++){
      st.count++; st.since++;
      let c;
      if(st.since >= UP_PITY){
        c = Gacha.draw(tF, 1)[0];                     // 60 抽硬保底：必得任意 SSR/SP
      }else{
        c = Gacha.draw(tN, 1)[0];
      }
      if(c && (c.rarity === 'ssr' || c.rarity === 'sp')){
        st.since = 0;                                 // 出了 SSR/SP，保底计数归零
        if(Math.random() * 100 < upRateAt(st.count)){
          c = { ...upChar, label: m.label, color: m.color };   // UP 判定命中 → UP 角色
        }
      }
      if(c) out.push(c);
    }
    saveUpState();
    paintUpBar();
    return out;
  }

  /** 主流程 doSummon 里的池子 → UP 页签映射 */
  const UP_TAB_BY_POOL = { [UP_POOL.key]: 'limited', [PICK_POOL.key]: 'pick' };

  // 选择卡池：常驻=蓝票；限时/自选=对应 UP 池（抽卡走 drawUpPool 规则）；
  // 三池互斥：选中的同时自动取消其它池的选中态
  upPick.addEventListener('click', ()=>{
    if(isTabLocked(upActive)) return;            // 限时UP 未上线：选不了（页签本身就是锁的，这里是兜底）
    if(upActive === 'perm'){
      pool = '蓝票';
      selUpTab = null;
      try{ localStorage.setItem(POOL_KEY, pool); }catch(e){}
      if(roster && Object.keys(roster).length) tiers = buildTiersFor(pool);
      updateUpSelUI();
      paintSegs();
      setTimeout(closeUpModal, 420);
      return;
    }
    const def = UP_DEFS[upActive] || UP_POOL;
    if(upActive === 'pick' && !pickChar){             // 自选还没选角色：先打开选择浮层
      upCharList.hidden = false;
      return;
    }
    pool = def.key;
    selUpTab = upActive;
    try{ localStorage.setItem(POOL_KEY, pool); }catch(e){}
    if(roster && Object.keys(roster).length) tiers = buildTiersFor(pool);
    updateUpSelUI();
    paintSegs();
    setTimeout(closeUpModal, 420);
  });

  /* ---------------- 自选角色选择浮层 ---------------- */
  let charListBuilt = false;
  function buildUpCharList(){
    if(charListBuilt) return;
    charListBuilt = true;
    // 只列 SSR / SP（保底与 UP 判定都作用在这两档，选别的没有意义）
    const RANK = { sp: 0, ssr: 1 };
    const list = [];
    const src = drawRoster();          // 未上线的限时UP 角色不能当自选 UP
    for(const k of Object.keys(src || {})){
      for(const c of (src[k] || [])){
        if(RANK[c.rarity] !== undefined) list.push(c);
      }
    }
    list.sort((a, b) => RANK[a.rarity] - RANK[b.rarity] || a.name.localeCompare(b.name, 'zh'));
    for(const c of list){
      const it = document.createElement('button');
      it.className = 'up-char-item';
      it.innerHTML = `<img src="${c.file}" alt=""><i>${c.name}</i>`;
      it.addEventListener('click', ()=>{
        // 已经用自选池抽过、且换了一个角色 → 重置该池概率进度（防止攒完进度再换人白嫖）
        const changed = !pickChar || pickChar.id !== c.id;
        const hadDrawn = upStates.pick.count > 0;
        pickChar = { id: c.id, name: c.name, img: c.file, rarity: c.rarity };
        try{ localStorage.setItem(PICK_CHAR_KEY, JSON.stringify(pickChar)); }catch(e){}
        if(changed && hadDrawn){
          upStates.pick = { count: 0, since: 0 };
          saveUpState();
        }
        upCharList.hidden = true;
        paintPickFigure();
        paintPickLine();
        paintUpBar();
      });
      upCharGrid.appendChild(it);
    }
  }
  /** 自选立绘区：没选角色显示「＋」，选了显示立绘（点立绘可重新选择） */
  function paintPickFigure(){
    const pane = document.querySelector('[data-pane="pick"]');
    if(pickChar){
      upAddBtn.style.display = 'none';
      upPickImg.hidden = false;
      upPickImg.src = pickChar.img;
      upPickImg.alt = pickChar.name;
      // 立绘放大为弹窗背景（同限时UP），页签内的立绘框隐藏
      document.getElementById('upPickFig').style.display = 'none';
      pane.classList.add('with-bg');
    }else{
      upAddBtn.style.display = '';
      upPickImg.hidden = true;
      document.getElementById('upPickFig').style.display = '';
      pane.classList.remove('with-bg');
    }
    syncUpBg();
  }
  /** 背景立绘同步：限时显示百羽凤凰火；自选已选角色时显示该角色（点背景可重选） */
  let upBgFace = null;   // 当前背景立绘的脸部数据 {x,y,s}（roster 里合并自 faces.json）
  function faceOfChar(id){
    const c = findCharById(id);
    return (c && c.face) || null;
  }
  /** 背景立绘定位规则：
      1. 基础：contain 置顶——整张图先完整放进弹窗、顶对齐，脸和身体默认完整可见；
      2. 脸部横向偏移 → 优先纯平移居中（利用 contain 留白），宽度受限平移够不着时
         才放大气补位（k = 0.5bw / (sw0·min(fx,1-fx))，封顶 1.45）；
      3. 脸部偏下（>45% 高度，开始压进底部渐变区）→ 向上平移把脸提到 ~38%；
      4. 脸部过于靠上（<25% 高度）→ 适当放大把脸往下带到 ~32%；
      5. 内容太小（contain 后高度不足弹窗 85%）→ 最小放大气补位（封顶 1.35）；
      6. 其余情况绝不缩放、绝不向下压，保住上半部分画面。
      face 数据可带 z（最小 zoom 倍数）用于个别角色微调。 */
  function applyUpBgPos(){
    const f = upBgFace;
    upBgImg.style.transform = '';
    upBgImg.style.objectPosition = 'center top';   // 置顶为基准
    if(!f) return;
    const bw = upBg.clientWidth, bh = upBg.clientHeight;
    const iw = upBgImg.naturalWidth, ih = upBgImg.naturalHeight;
    if(!iw || !ih || !bw || !bh) return;          // 图片未加载完，load 事件里会再算
    const cl = (v,lo,hi)=>Math.max(lo,Math.min(hi,v));
    const sc  = Math.min(bw / iw, bh / ih);       // contain：整张图先完整放下
    const sw0 = iw * sc, sh0 = ih * sc;
    // —— 缩放决策（取各规则所需的最大值）——
    let k = f.z > 1 ? f.z : 1;                    // 个别角色的人工最小倍数
    // 规则4：脸过于靠上（放大后会 <25% 高）才放大往下带
    if (f.y * sh0 * k < 0.25 * bh)
      k = Math.max(k, cl(0.32 * bh / (f.y * sh0), 1, 1.4));
    // 规则5：内容太小（纵向不满 85%）→ 最小放大气补位
    k = Math.max(k, cl(0.85 * bh / sh0, 1, 1.35));
    // 规则2：横向——脸明显偏移（>4% 宽）才动；先平移（利用留白），平移钳不住才放大
    const pxTest = cl(0.5 * bw - f.x * sw0, Math.min(0, bw - sw0), Math.max(0, bw - sw0));
    if (Math.abs(0.5 * bw - (f.x * sw0 + pxTest)) > 0.04 * bw){
      const need = 0.5 * bw / (sw0 * Math.min(f.x, 1 - f.x));
      k = Math.max(k, cl(need, 1, 1.45));
    }
    const sw = sw0 * k, sh = sh0 * k;
    // 横向位置：脸居中，钳制在内容可移动范围内（不让内容整体跑出画面）
    const px = cl(0.5 * bw - f.x * sw, Math.min(0, bw - sw), Math.max(0, bw - sw));
    // 规则3/6：纵向置顶为基准，只有脸压进底部渐变区才向上提；绝不向下压。
    // 内容比弹窗矮时也允许上提：底部有渐变遮罩，露出的暗底不可见。
    // f.dy = 人工微调的额外上提量（弹窗高度占比，负值向上）。
    let py = 0;
    if (f.y * sh > 0.45 * bh)
      py = Math.min(0, 0.38 * bh - f.y * sh);
    py = Math.min(0, py + (f.dy || 0) * bh);
    // 换算成元素 transform（contain 内容默认位于 (cx0, 0)，scale 原点 0 0）
    const cx0 = (bw - sw0) / 2;
    const tx = px - k * cx0, ty = py;
    if(k <= 1.001 && Math.abs(tx) < .5 && Math.abs(ty) < .5) return;
    upBgImg.style.transformOrigin = '0 0';
    upBgImg.style.transform = (k <= 1.001)
      ? `translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px)`
      : `translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) scale(${k.toFixed(3)})`;
  }
  upBgImg.addEventListener('load', applyUpBgPos);
  function syncUpBg(){
    const pickMode = (upActive === 'pick' && pickChar);
    upBg.hidden = !(upActive === 'limited' || pickMode);
    upBg.classList.toggle('pick-sel', pickMode);
    upBgFace = pickMode ? faceOfChar(pickChar.id) : faceOfChar(UP_POOL.charId);
    upBgImg.src = pickMode ? pickChar.img : UP_POOL.img;
    applyUpBgPos();   // src 未变时不触发 load，这里直接补算
  }
  upBg.addEventListener('click', ()=>{
    if(upActive === 'pick' && pickChar){ buildUpCharList(); upCharList.hidden = false; }
  });
  upAddBtn.addEventListener('click', ()=>{ buildUpCharList(); upCharList.hidden = false; });
  upPickImg.addEventListener('click', ()=>{ buildUpCharList(); upCharList.hidden = false; });   // 点立绘重选
  // 选角后立绘框会隐藏、背景放大铺满——但 .up-pane 层压在背景上会吃掉空白区域的点击，
  // 这里补一层：点在页签空白处（非按钮/立绘/文字行）也算「点已选角色位置」→ 重新选人。
  document.querySelector('[data-pane="pick"]').addEventListener('click', e=>{
    if(upActive !== 'pick' || !pickChar) return;
    if(e.target.closest('button, img, .up-rate, .up-strip, .up-banner')) return;
    buildUpCharList(); upCharList.hidden = false;
  });
  document.getElementById('upCharClose').addEventListener('click', ()=>{ upCharList.hidden = true; });
  /* 选人列表：桌面端鼠标按住拖动即可滚动（触摸端原生滑动不受影响）。
     拖动超过 6px 时吞掉后续 click，避免「拖完停在某个角色上被误选」。 */
  (function upGridDragScroll(){
    const g = document.getElementById('upCharGrid');
    let drag = null;
    g.addEventListener('mousedown', e=>{
      if(e.button !== 0) return;
      drag = { x: e.clientX, y: e.clientY, top: g.scrollTop, moved: false };
      g.classList.add('dragging');
    });
    window.addEventListener('mousemove', e=>{
      if(!drag) return;
      const dy = e.clientY - drag.y;
      if(Math.abs(dy) > 2 || Math.abs(e.clientX - drag.x) > 2) drag.moved = true;
      g.scrollTop = drag.top - dy;
    });
    window.addEventListener('mouseup', ()=>{
      if(!drag) return;
      const moved = drag.moved;
      drag = null;
      g.classList.remove('dragging');
      if(moved) g.addEventListener('click', e=>{ e.stopPropagation(); e.preventDefault(); },
                                  { capture:true, once:true });
    });
    g.addEventListener('click', e=>{ if(g.classList.contains('dragging')){ e.stopPropagation(); e.preventDefault(); } });
  })();

  /* ---------------- 常驻统计（纯文字） ---------------- */
  function paintUpStats(){
    if(!drawStats.total){
      upStats.textContent = '还没有抽卡记录';
      return;
    }
    const s = drawStats;
    upStats.innerHTML =
      `累计召唤 <b>${s.total}</b> 次<br>` +
      `<span class="st-row">` +
      `<span>UR <b>${s.ur}</b></span>` +
      `<span>SSR <b>${s.ssr}</b></span>` +
      `<span>SP <b>${s.sp}</b></span>` +
      `<span>SR <b>${s.sr}</b></span>` +
      `<span>R <b>${s.r}</b></span>` +
      `<span>N <b>${s.n}</b></span>` +
      `</span>`;
  }

  // 调试钩子：自动化测试用，玩家无感知
  window.__UP_DEBUG__ = { drawUpPool, upRateAt, states: () => JSON.parse(JSON.stringify(upStates)), stats: () => ({ ...drawStats }), UP_POOL, PICK_POOL };

  const HOLD=1250, OVERLAP=480, EXIT=900;
  let seqList = [], seqTimer = null;
  let freshIds = new Set();      // 本次新解锁的角色
  let curSeqIdx = -1;            // 揭晓页当前已落场的角色下标（跳过时补录它之后的角色用）
  let skipMode = false;          // 跳过模式：快速掠过「已有」角色，新角色仍完整落场
  let singleReady = false;       // 单抽揭晓页：落场片刻后才允许「点击任意处返回」

  /* ---------------- 式神语音 ----------------
     voiceMap：角色 id -> music/ 下的相对路径，由 gen-voice.js 扫描生成。
     有语音 → 播完（+ 短暂停留）再切下一个；没语音 → 退回原来的 HOLD 停留。 */
  const VOICE_TAIL = 650;        // 语音播完后再停留一会儿，给个收尾呼吸
  const VOICE_LEAD = 260;        // 卡面弹出后稍等再开口，不和入场动画撞在一起
  const VOICE_MAX  = 8000;       // 无时长信息时的兜底上限（元数据异常也不至于停 30 秒）
  const VOICE_KEY  = 'onmyoji_voice_v1';   // 兼容旧存储键（音声开关已移除，语音常开）
  let voiceMap  = {};
  let voiceBase = 'music/';
  let voiceOn   = true;
  let voiceCtl  = null;          // 当前语音的控制句柄

  const audioCache = new Map();  // url -> HTMLAudioElement（复用，顺带当缓存）
  function audioFor(url){
    let a = audioCache.get(url);
    if(!a){
      a = new Audio();
      a.preload = 'auto';
      a.src = url;
      // 挂进 DOM（隐藏）：方便调试时在 DevTools 里直接看到当前有哪些语音在加载/播放
      a.style.display = 'none';
      a.dataset.voice = '1';
      document.body.appendChild(a);
      audioCache.set(url, a);
    }
    return a;
  }

  // ---- 动作音效（非角色语音，按固定文件名直接引用）----
  // 同一个 url 只对应一个 Audio 实例，重播时回到开头播放，永远不会「打架」。
  const DRAW_SFX  = 'music/绘制.mp3';   // 玩家绘制图案时循环感地播放
  const SUMMON_SFX= 'music/召唤.mp3';   // 点击召唤时播放
  function playSfx(url){
    const a = audioFor(url);
    try{ a.currentTime = 0; const p = a.play(); if(p && p.catch) p.catch(()=>{}); }catch(e){}
  }
  function stopSfx(url){
    const a = audioCache.get(url);
    if(a){ try{ a.pause(); a.currentTime = 0; }catch(e){} }
  }
  function playDrawSound(){ playSfx(DRAW_SFX); }
  function stopDrawSound(){ stopSfx(DRAW_SFX); }
  function playSummonSound(){ playSfx(SUMMON_SFX); }
  function voiceUrlOf(c){
    const rel = voiceMap[c.id];
    return rel ? Gacha.voiceUrl(voiceBase, rel) : null;
  }

  /** 停掉当前语音。runDone=true 时立即推进流程（用于中途关声音），否则只是静音。 */
  function stopVoice(runDone){
    if(voiceCtl){ voiceCtl.stop(runDone); voiceCtl = null; }
  }

  /**
   * 播报一个角色的语音，播完（或播不了 / 被停掉）后回调 done。
   * 没有语音时按 HOLD 停留后回调。返回一个 {stop} 句柄。
   */
  function playVoice(c, done){
    const url = voiceOn ? voiceUrlOf(c) : null;
    const holdThen = ms => {
      const t = setTimeout(done, ms);
      return { stop(runDone){ clearTimeout(t); if(runDone) done(); } };
    };
    if(!url) return holdThen(HOLD);

    let a;
    try{ a = audioFor(url); }
    catch(e){ return holdThen(HOLD); }

    let settled = false, t1 = null, t2 = null, leadT = null;
    const detach = () => {
      a.removeEventListener('ended', onEnd);
      a.removeEventListener('error', onEnd);
      a.removeEventListener('loadedmetadata', refineLimit);
      if(t1){ clearTimeout(t1); t1 = null; }
    };
    const onEnd = () => {
      if(settled) return;
      settled = true;
      detach();
      t2 = setTimeout(() => { t2 = null; done(); }, VOICE_TAIL);
    };
    // 拿到真实时长就把上限改成「时长 + 余量」，长语音不会被 VOICE_MAX 截断；
    // 元数据来得晚也没关系，loadedmetadata 会再调一次。
    const refineLimit = () => {
      if(settled) return;
      const dur = (a.duration && isFinite(a.duration) && a.duration > 0) ? a.duration * 1000 : 0;
      if(dur){
        clearTimeout(t1);
        t1 = setTimeout(onEnd, dur + VOICE_LEAD + 1500);
      }
    };

    a.addEventListener('ended', onEnd);
    a.addEventListener('error', onEnd);
    a.addEventListener('loadedmetadata', refineLimit);

    // 硬上限：从调用开始算，防止元数据异常 / 事件丢失把流程卡死
    t1 = setTimeout(onEnd, VOICE_MAX);
    refineLimit();                 // 已预取过的语音此刻就有 duration，先把上限放宽

    // 卡面弹出后稍等再开口，不和入场动画撞在一起
    leadT = setTimeout(() => {
      leadT = null;
      try{ a.currentTime = 0; }catch(e){}
      const p = a.play();
      if(p && typeof p.catch === 'function') p.catch(()=>onEnd());   // 自动播放被拦也别卡住
      refineLimit();                                                 // play 之后再补一次
    }, VOICE_LEAD);

    return {
      stop(runDone){
        if(leadT){ clearTimeout(leadT); leadT = null; }
        detach();
        if(t2){ clearTimeout(t2); t2 = null; }
        try{ a.pause(); a.currentTime = 0; }catch(e){}
        if(runDone && !settled){ settled = true; done(); }
        settled = true;
      }
    };
  }

  /* ---------------- 本轮媒体预取 ----------------
     揭晓原本是「翻到谁才去下载谁」：冷启动时每张卡都要等 0.6~1.3s，
     其中约 0.65s 纯粹是首字节等待（TTFB），十连就是十次串行空窗。
     门过场那 1~4 秒是闲着的，用来把这轮的立绘并行拉完，揭晓时直接命中缓存。
     并发限 6：太多会抢带宽，反而把正在播的召唤音效和门光效拖卡。 */
  const PREFETCH_CONCURRENCY = 6;
  const VOICE_WARM_AHEAD = 3;          // 语音预热窗口（含下一条）
  const prefetched = new Set();        // 已预取过的 url，整页生命周期内不重复拉

  async function prefetchImages(urls){
    const queue = (urls || []).filter(u => u && !prefetched.has(u));
    queue.forEach(u => prefetched.add(u));
    let cursor = 0;
    const worker = async () => {
      while(cursor < queue.length){
        const u = queue[cursor++];
        await new Promise(done => {
          const im = new Image();
          im.onload = im.onerror = done;
          im.src = u;
        });
      }
    };
    const n = Math.min(PREFETCH_CONCURRENCY, queue.length);
    await Promise.all(Array.from({ length: n }, worker));
  }

  /** 预取一整轮的媒体：立绘全量 + 语音前几条（剩下的靠 warmNextVoice 滚动补） */
  function prefetchSeqMedia(list){
    if(!list || !list.length) return;
    prefetchImages(list.map(c => c && c.file)).catch(()=>{});
    if(!voiceOn) return;
    for(const c of list.slice(0, VOICE_WARM_AHEAD)){
      const u = c && voiceUrlOf(c);
      if(u) audioFor(u);               // preload='auto'，建好就由浏览器去缓冲
    }
  }

  /** 提前把后面几条语音拉起来，切换时不用等网络 */
  function warmNextVoice(i){
    if(!voiceOn) return;
    for(let k = 1; k <= VOICE_WARM_AHEAD; k++){
      const nx = seqList[i + k];
      if(!nx) break;
      const u = voiceUrlOf(nx);
      if(u) audioFor(u);
    }
  }

  /* ---------------- 语音开关（已移除按钮，语音常开） ---------------- */

  function buildDots(n){
    seqDots.innerHTML = '';
    if(n <= 1){ seqDots.style.display='none'; return; }
    seqDots.style.display='flex';
    for(let i=0;i<n;i++) seqDots.appendChild(document.createElement('i'));
  }
  function paintDots(i){
    [...seqDots.children].forEach((d,k)=>{
      d.classList.toggle('on', k===i);
      d.classList.toggle('done', k<i);
    });
  }
  function clearScene(){
    sceneChars.innerHTML = '';
    sceneName.classList.remove('in');
    seqProgress.textContent = '';
  }
  function stopSeq(){ if(seqTimer){ clearTimeout(seqTimer); seqTimer=null; } }

  /* ---------- SSR/SP 专属落场：黑屏渐入 → 立绘渐现 → 上升光点 → 播语音 ----------
     不论角色是否已拥有都完整演出；跳过模式下同样不掠过。 */
  const SPECIAL_RARITY = new Set(['ssr','sp']);
  let srSparkT = null;
  const isSpecial = c => SPECIAL_RARITY.has(String(c.rarity || '').toLowerCase());

  function srStartSparks(){
    srStopSparks();
    srSparkT = setInterval(()=>{
      const s = document.createElement('div');
      s.className = 'spark';                       // 与召唤阵同款光点（rise 动画）
      s.style.left = (6 + Math.random()*88) + '%';
      const d = 2.6 + Math.random()*2.8;
      s.style.animationDuration = d + 's';
      s.style.width = s.style.height = (4 + Math.random()*5) + 'px';
      srSparks.appendChild(s);
      setTimeout(()=>s.remove(), (d + 0.5) * 1000);
    }, 160);
  }
  function srStopSparks(){
    if(srSparkT){ clearInterval(srSparkT); srSparkT = null; }
    srSparks.innerHTML = '';
  }
  /** 黑幕淡出（正常过场收尾）；force=true 立即收掉（跳过/Esc/收起时用） */
  function srFadeOut(){
    srStopSparks();
    srFx.classList.remove('on');
    srImg.classList.remove('in');
    reveal.classList.remove('sr-black');      // 底部按钮/进度点恢复（无论正常收尾还是被跳过）
    setTimeout(()=>{ if(!srFx.classList.contains('on')) srFx.hidden = true; }, 650);
  }
  const srHide = srFadeOut;                        // 语义别名：强制收掉

  /** SSR/SP 落场：与 enterChar 同样的记录/名牌逻辑，但演出换成黑幕→立绘→语音 */
  function enterCharSpecial(i){
    const c = seqList[i];

    // 记录收集（与普通落场一致）
    curSeqIdx = i;
    const isNew = !Gacha.Codex.has(c.id);
    Gacha.Codex.add(c.id);
    if(isNew) freshIds.add(c.id);

    // 名牌复用 sceneName（z-index 在黑幕之上，照常显示）
    const nm = document.getElementById('rvName');
    const bg = document.getElementById('rvBadge');
    nm.textContent = c.name;
    bg.textContent = c.label;
    bg.style.background = `linear-gradient(180deg, ${c.color}, #5a3308)`;
    const old = sceneName.querySelector('.new');
    if(old) old.remove();
    if(isNew){
      const tag = document.createElement('span');
      tag.className = 'new'; tag.textContent = 'NEW';
      sceneName.appendChild(tag);
    }
    paintDots(i);
    seqProgress.textContent = seqList.length>1 ? `${i+1} / ${seqList.length}` : '';

    // ① 黑屏渐入 → ② 立绘渐现 + 光点上升 → ③ 播语音 → ④ 黑幕淡出接下一发
    const BLACK = 650, ART = 800;
    // 立绘加载完再淡入（替代「黑屏里突然蹦出图」的空白感）；加载失败也照常显示，绝不卡住流程
    srImg.onload  = () => srImg.classList.add('loaded');
    srImg.onerror = () => srImg.classList.add('loaded');
    srImg.classList.remove('loaded');
    srImg.src = c.file;
    srImg.classList.remove('in');
    srFx.hidden = false;
    reveal.classList.add('sr-black');         // 黑幕期间隐去底部 UI → 全屏纯黑
    requestAnimationFrame(()=>requestAnimationFrame(()=>srFx.classList.add('on')));
    seqTimer = setTimeout(()=>{
      sceneName.classList.remove('in');
      srStartSparks();
      srImg.classList.add('in');
      seqTimer = setTimeout(()=>{
        sceneName.classList.add('in');
        reveal.classList.remove('sr-black');  // 立绘已渐现：底部按钮/进度点淡回来
        warmNextVoice(i);
        if(seqList.length <= 1){ voiceCtl = playVoice(c, ()=>{}); return; }  // 单抽：停住
        voiceCtl = playVoice(c, ()=>{
          voiceCtl = null;
          srFadeOut();
          sceneName.classList.remove('in');
          const isLast = (i >= seqList.length-1);
          seqTimer = setTimeout(()=>{
            if(isLast) goSummary(); else gotoChar(i+1);
          }, isLast ? 300 : 620);
        });
      }, ART);
    }, BLACK);
  }

  function enterChar(i){
    const c = seqList[i];
    if(isSpecial(c)){ enterCharSpecial(i); return; }   // SSR/SP：专属黑幕演出
    const el = document.createElement('div');
    el.className = 'scene-char enter';
    const im = document.createElement('img');
    im.alt = c.name || '';
    // 与 #srImg 完全一致：加载完（或失败）才加 .loaded 淡入。
    // 缺了这步，CSS 里 .scene-char img{opacity:0} 永远不解除 → 立绘全透明看不见。
    im.addEventListener('load',  () => im.classList.add('loaded'), { once:true });
    im.addEventListener('error', () => im.classList.add('loaded'), { once:true });
    im.src = c.file;
    if(im.complete && im.naturalWidth) im.classList.add('loaded');   // 命中缓存时同步补一次
    el.appendChild(im);
    sceneChars.appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.classList.remove('enter');
      el.classList.add('in');
    }));

    // 记录收集（每个角色只在其首次出现时标记 NEW）
    curSeqIdx = i;
    const isNew = !Gacha.Codex.has(c.id);
    Gacha.Codex.add(c.id);
    if(isNew) freshIds.add(c.id);

    const nm = document.getElementById('rvName');
    const bg = document.getElementById('rvBadge');
    nm.textContent = c.name;
    bg.textContent = c.label;
    bg.style.background = `linear-gradient(180deg, ${c.color}, #5a3308)`;
    // 旧的 NEW 角标清掉再加
    const old = sceneName.querySelector('.new');
    if(old) old.remove();
    if(isNew){
      const tag = document.createElement('span');
      tag.className = 'new'; tag.textContent = 'NEW';
      sceneName.appendChild(tag);
    }
    sceneName.classList.add('in');

    paintDots(i);
    seqProgress.textContent = seqList.length>1 ? `${i+1} / ${seqList.length}` : '';
    warmNextVoice(i);

    // 有语音 → 播完再走；没语音 → 按原节奏停留
    if(seqList.length <= 1){ voiceCtl = playVoice(c, ()=>{}); return; }  // 单抽：停住
    voiceCtl = playVoice(c, ()=>{ voiceCtl = null; exitChar(el, i); });
  }

  function exitChar(el, i){
    if(!el || !el.isConnected) return;
    el.classList.remove('in');
    el.classList.add('out');
    sceneName.classList.remove('in');
    setTimeout(()=>el.remove(), EXIT+50);

    const isLast = (i >= seqList.length-1);
    seqTimer = setTimeout(()=>{
      if(isLast) goSummary(); else gotoChar(i+1);
    }, isLast ? EXIT-150 : OVERLAP);
  }

  /** 落场调度：跳过模式下已有角色快速掠过（只记录+推进度），新角色完整落场（动画+语音） */
  function gotoChar(i){
    if(i >= seqList.length){
      paintDots(seqList.length-1);
      goSummary();
      return;
    }
    const c = seqList[i];
    if(skipMode && Gacha.Codex.has(c.id) && !isSpecial(c)){   // SSR/SP 即使已拥有也不掠过
      Gacha.Codex.add(c.id);          // 已有角色：静默记录，不播动画/语音
      curSeqIdx = i;                  // 已记录到 i，recordRemaining 从 i+1 补录才不会重复计数
      paintDots(i);
      seqProgress.textContent = seqList.length>1 ? `${i+1} / ${seqList.length}` : '';
      seqTimer = setTimeout(()=>gotoChar(i+1), 130);
      return;
    }
    enterChar(i);                     // 新角色（或非跳过模式）：完整落场
  }

  function goSummary(){
    reveal.classList.remove('on');
    showSummary(seqList);
  }
  /** 收集补录：把揭晓页还没落场的角色（Esc 等提前退出时）记进收集册，
      避免结算页看得到、图鉴里却没有。已落场的不再重复计数。 */
  function recordRemaining(){
    for(let i = curSeqIdx + 1; i < seqList.length; i++){
      const c = seqList[i];
      if(!c || !c.id) continue;
      if(!Gacha.Codex.has(c.id)) freshIds.add(c.id);
      Gacha.Codex.add(c.id);
    }
    curSeqIdx = seqList.length - 1;
  }
  function finishNow(){
    srHide();                         // SSR/SP 黑幕演出无论走到哪一步都先收掉
    if(skipMode){
      // 跳过进行中再点跳过：直接强制结束、进结算。
      // 不能只是 return——先执行的 stopVoice/stopSeq 会掐断推进链路
      // （语音回调不触发、定时器被清），揭晓页就永久卡死了。
      stopVoice(false);
      stopSummonFx();
      stopSeq();
      recordRemaining();
      skipMode = false;
      sceneChars.querySelectorAll('.scene-char').forEach(el=>{
        el.classList.remove('in'); el.classList.add('out');
        setTimeout(()=>el.remove(), EXIT);
      });
      sceneName.classList.remove('in');
      seqTimer = setTimeout(goSummary, 150);
      return;
    }
    stopVoice(false);
    stopSummonFx();
    stopSeq();
    skipMode = true;
    skipBtn.classList.add('hide');    // 已在跳过，按钮不再需要（下次召唤会自动恢复）
    sceneChars.querySelectorAll('.scene-char').forEach(el=>{
      el.classList.remove('in'); el.classList.add('out');
      setTimeout(()=>el.remove(), EXIT);
    });
    sceneName.classList.remove('in');
    seqTimer = setTimeout(()=>gotoChar(curSeqIdx + 1), 350);
  }

  /* 十连召唤阵容页：按稀有度排布（最高稀有度居中），带竖排名牌绶带 */
  function showSummary(list){
    luRow.innerHTML = '';
    const order = (rates && rates.order) || [];
    const rank = c => { const i = order.indexOf(c.rarity); return i === -1 ? 99 : i; };
    const sorted = [...list].sort((a,b)=> rank(a)-rank(b));
    const n = sorted.length;
    // 中间放最高稀有度：位置从中间向两侧交替铺开（n=10 → 4,5,3,6,2,7,1,8,0,9）
    const pos = [];
    let lo = Math.floor((n-1)/2), hi = Math.ceil((n-1)/2);
    pos.push(lo); if(hi !== lo) pos.push(hi);
    while(pos.length < n){ lo--; hi++; if(lo >= 0) pos.push(lo); if(hi <= n-1) pos.push(hi); }
    const slots = new Array(n);
    sorted.forEach((c,i)=>{ slots[pos[i]] = c; });
    slots.forEach((c,i)=>{
      const el = document.createElement('div');
      el.className = 'lu-slot';
      const dist = Math.abs(i - (n-1)/2);
      // 宽度驱动：中心 14.5vw 向两边线性递减（面积差近 3 倍），总宽必在屏内
      el.style.setProperty('--lu-w', Math.max(7, 14.5 - dist*1.5).toFixed(2) + 'vw');
      el.style.setProperty('--lu-z', String(100 - Math.round(dist*10)));
      el.style.setProperty('--lu-delay', (i*85) + 'ms');
      el.innerHTML =
        `<div class="lu-banner" style="--lu-c:${c.color}"><span class="rb">${c.label}</span>` +
        `<span class="rn">${c.name}</span></div>` +
        (freshIds.has(c.id) ? `<span class="lu-new">NEW</span>` : '') +
        `<img src="${c.file}" alt="${c.name}">`;
      luRow.appendChild(el);
    });
    reveal10.classList.add('on');
  }

  // 关门→(切换内容)→开门 的过场，替代刺眼的白屏闪烁
  // leadInMs：门延迟多久才合拢（用于让前置光效填满音效前期，匹配音效时长）
  // doorSeq 代数号：新的 backToStage 会让仍在倒计时的旧过场回调失效（如快速抽卡前奏期间点收起）
  let doorSeq = 0;
  function doorTransition(midFn, leadInMs){
    leadInMs = leadInMs || 0;
    const myGen = doorSeq;
    const beginClose = () => {
      door.classList.remove('opening');
      door.classList.add('closing');
      setTimeout(()=>{
        try{ if(doorSeq === myGen && midFn) midFn(); }catch(e){ console.error(e); }
        // 让门后内容先就位，再开门
        setTimeout(()=>{
          door.classList.remove('closing');
          door.classList.add('opening');
          setTimeout(()=>{ door.classList.remove('opening'); }, DOOR_OPEN_MS + 80);
        }, 70);
      }, DOOR_CLOSE_MS);
    };
    if(leadInMs > 0) setTimeout(beginClose, leadInMs);
    else beginClose();
  }

  /* fast=true：结算页「再次绘制」快速通道——只播召唤语音的前奏（~1.1s）就开始关门，
     不放蝴蝶注入光效；false：完整流程（光效填满整段语音再关门）。
     fastNext：由结算页「再次绘制」设置——回到抽卡界面重新画，玩家可任意改十连/单抽与池子，
     下一次召唤（无论什么配置）都走快速通道；「收起」则下一次保持完整流程。 */
  let fastNext = false;    // 下一次召唤是否走快速通道
  let summoning = false;   // 门过场进行中，防止重复触发
  function doSummon(fast){
    if(!tiers.length || summoning || leaving) return;
    summoning = true;
    stopVoice(false);
    stopDrawSound();                 // 绘制音效先停下，避免和召唤音效叠在一起
    freshIds = new Set();
    curSeqIdx = -1;
    skipMode = false;
    playSummonSound();               // 点击召唤即播放召唤音效
    const sa = audioFor(SUMMON_SFX);
    let D = SUMMON_AUDIO_DUR;        // 兜底：音频元数据没拿到时用实测值
    if(sa && sa.duration && isFinite(sa.duration) && sa.duration > 0) D = sa.duration;
    // 完整流程：门的「合拢」落在音效最后那一下关门声附近；快速流程：前奏 1.1s 即关门
    const leadInMs = fast ? 1100 : Math.max(0, D - (DOOR_CLOSE_MS/1000) - 0.12) * 1000;
    // 十周年：按 rates.json 的 tenth.sequence 固定分段规则抽 10 连；
    // UP 池（限时/自选）：走 drawUpPool（SSR/SP×2.5 + 60抽保底 + 阶梯UP判定）；
    // 普通：按当前模式（单抽/十连）与池子概率抽
    // 提到门过场「之前」：这样过场那 1~4 秒就能用来预取立绘和语音，
    // 原来是在门关上才抽，预取一点提前量都没有。
    const useTenth = !tenthUsed;     // 十周年特别版：仅第一次点击生效
    const upTab = UP_TAB_BY_POOL[pool];
    const picked = useTenth ? Gacha.drawTenth(drawRoster(), rates)
                 : (upTab
                     ? drawUpPool(upTab, mode === 'ten' ? 10 : 1)
                     : Gacha.draw(tiers, mode === 'ten' ? 10 : 1));
    prefetchSeqMedia(picked);        // 并发预取，揭晓时直接命中缓存
    if(!fast) startSummonFx(leadInMs);

    const startReveal = () => {
      summoning = false;
      fastNext = false;              // 快速标记仅对这一次召唤生效
      if(fast) stopSfx(SUMMON_SFX);  // 快速模式只播前奏，关门时停掉剩余语音
      stopSummonFx();                // 门关上、揭晓前停下光效
      seqList = picked;
      // 常驻页签统计：十周年特别召唤不计入任何卡池数据
      if(!useTenth) addDrawStats(seqList);
      paintUpStats();
      if(!seqList.length){ return; }
      if(useTenth){
        tenthUsed = true;
        try{ localStorage.setItem(TENTH_KEY, '1'); }catch(e){}
        paintSummonBtn();
        paintSegs();                 // 用掉即解锁，恢复玩家自己的模式/池子显示
      }
      stopSeq(); clearScene();
      buildDots(seqList.length);
      const single = seqList.length <= 1;
      skipBtn.classList.toggle('hide', single);
      seqActions.style.display = single ? 'none' : 'flex';
      seqSingle.style.display = 'none';
      singleReady = false;                 // 落场片刻后才亮出按钮，避免误触
      if(single) setTimeout(()=>{ singleReady = true; seqSingle.style.display = 'flex'; }, 1400);
      reveal.classList.add('on');
      enterChar(0);
    };
    /* 一律走门过场（含首位就是 SSR/SP 的情况）：关门 → 揭晓 → 开门，
       SSR/SP 的黑幕在开门时同步渐入，仍是「先全黑、再从黑里出角色」。 */
    doorTransition(startReveal, leadInMs);
  }

  summonBtn.addEventListener('click', ()=>doSummon(fastNext));

  /* ---------------- 召唤阵注入光效（红瓣 + 金光屑）· 不满意可整体删除 ---------------- */
  let fxRunning=false, fxRAF=null, fxSpawnT=null, fxStart=0, fxDur=0;
  let fxCircle, fxGlow;

  function fxSpawnButterfly(){
    if(!fxRunning) return;
    const W=window.innerWidth, H=window.innerHeight;
    // ~70% 红瓣 / 30% 金光屑，呼应页面金红符阵主题
    const type = Math.random() < 0.7 ? 'fx-petal' : 'fx-spark';
    const el = document.createElement('div');
    el.className = type;
    if(type === 'fx-petal'){
      const s = 12 + Math.random()*14;
      el.style.width = s+'px'; el.style.height = s+'px';
    }else{
      const s = 3 + Math.random()*3;
      el.style.width = s+'px'; el.style.height = s+'px';
    }
    // 从屏幕四边随机飞入
    const edge=Math.floor(Math.random()*4);
    let x0,y0;
    if(edge===0){ x0=Math.random()*W; y0=-40; }
    else if(edge===1){ x0=W+40; y0=Math.random()*H; }
    else if(edge===2){ x0=Math.random()*W; y0=H+40; }
    else { x0=-40; y0=Math.random()*H; }
    const cx=W/2, cy=H/2;
    const ang=Math.random()*Math.PI*2, r=Math.min(W,H)*0.32;
    // 二次贝塞尔：从边缘经一个偏移控制点汇入中心（注入召唤阵）
    el._p={ x0, y0, cx:cx+Math.cos(ang)*r, cy:cy+Math.sin(ang)*r, tx:cx, ty:cy,
            born:performance.now(),
            life:1100+Math.random()*900,
            rot0:Math.random()*360,
            spin:(Math.random()-0.5)*540,    // °/s 红瓣有旋转
            type };
    fxButterflies.appendChild(el);
  }

  function fxFrame(now){
    if(!fxRunning) return;
    const W=window.innerWidth, H=window.innerHeight;
    const t=Math.min(1,(now-fxStart)/fxDur);          // 0..1  buildup
    const s=0.2+Math.min(1,t)*0.95, op=Math.min(1,t*1.5);
    if(fxCircle){ fxCircle.style.transform=`scale(${s}) rotate(${(now/26)%360}deg)`; fxCircle.style.opacity=op; }
    if(fxGlow){ const gp=s*(1+0.12*Math.sin(now/260)); fxGlow.style.transform=`scale(${gp})`; fxGlow.style.opacity=op; }
    const bs=fxButterflies.children;
    for(let i=bs.length-1;i>=0;i--){
      const b=bs[i], p=b._p; if(!p) continue;
      const u=(now-p.born)/p.life;
      if(u>=1){ b.remove(); continue; }
      const inv=1-u;
      const x=inv*inv*p.x0+2*inv*u*p.cx+u*u*p.tx;     // 贝塞尔插值
      const y=inv*inv*p.y0+2*inv*u*p.cy+u*u*p.ty;
      const fade=u<0.7?1:(1-(u-0.7)/0.3);             // 靠近中心时淡出（注入消散）
      // 用 translate(-50%,-50%) 让粒子中心对准 (x,y)
      const sec=p.life*u/1000;                        // 已运动秒数
      const rot = p.rot0 + p.spin*sec;                // 红瓣持续旋转
      const scl = p.type==='fx-petal'
        ? (1 - u*0.25 + 0.08*Math.sin(now/130 + i))   // 红瓣：轻微飘动
        : (0.6 + 0.6*Math.abs(Math.sin(now/110 + i)));// 光屑：闪烁
      b.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) rotate(${rot}deg) scale(${scl})`;
      b.style.opacity=Math.max(0,fade)*0.95;
    }
    fxRAF=requestAnimationFrame(fxFrame);
  }

  function startSummonFx(leadInMs){
    if(fxRunning) return;
    fxRunning=true;
    fxDur=Math.max(400,leadInMs);
    fxStart=performance.now();
    fxCircle=summonFx.querySelector('.fx-circle');
    fxGlow =summonFx.querySelector('.fx-glow');
    summonFx.classList.add('on');
    fxFrame(fxStart);
    fxSpawnT=setInterval(fxSpawnButterfly,210);       // 持续有红瓣/光屑汇入
    fxSpawnButterfly(); fxSpawnButterfly(); fxSpawnButterfly();
  }

  function stopSummonFx(){
    fxRunning=false;
    if(fxRAF){ cancelAnimationFrame(fxRAF); fxRAF=null; }
    if(fxSpawnT){ clearInterval(fxSpawnT); fxSpawnT=null; }
    summonFx.classList.remove('on');
    if(fxButterflies) fxButterflies.innerHTML='';
    if(fxCircle){ fxCircle.style.transform='scale(.2)'; fxCircle.style.opacity=0; }
    if(fxGlow){ fxGlow.style.transform='scale(.2)'; fxGlow.style.opacity=0; }
  }

  function closeAll(){
    stopVoice(false);
    stopDrawSound();
    stopSfx(SUMMON_SFX);            // 快速通道前奏可能还在响，一并停掉
    stopSummonFx();                 // 任何退出路径都确保蝴蝶光效停下
    srHide();                       // SSR/SP 黑幕演出一并收掉
    if(reveal.classList.contains('on') || reveal10.classList.contains('on')){
      recordRemaining();            // Esc 等直接退出也补录，图鉴不漏记（已录完则为空操作）
    }
    stopSeq(); clearScene();
    reveal.classList.remove('on');
    reveal10.classList.remove('on');
  }
  function reset(){
    closeAll();
    strokes=[]; redraw();
  }
  againBtn.addEventListener('click', reset);
  closeBtn.addEventListener('click', closeAll);
  skipBtn.addEventListener('click', finishNow);

  // 十连结算页：再次绘制（快速通道，固定十连）/ 收起（回抽卡界面，下次完整流程）
  // 单抽揭晓页：同样 再次绘制（快速通道，按当前模式）/ 收起
  let leaving = false;
  function backToStage(){
    if(leaving) return;
    leaving = true;
    doorSeq++;                        // 作废仍在倒计时的旧过场回调（快速抽卡前奏等）
    summoning = false;                // 允许回到抽卡界面后再次召唤
    doorTransition(()=>{ reset(); setTimeout(()=>{ leaving = false; }, 120); });
  }
  // 结算页「再次绘制」：回到抽卡界面重新画（十连/单抽/池子随意选），下一次召唤走快速通道
  // 「收起」：回抽卡界面，下一次召唤保持完整流程
  againBtn10.addEventListener('click', ()=>{ fastNext = true; backToStage(); });
  closeBtn10.addEventListener('click', backToStage);
  againBtnS.addEventListener('click', ()=>{ fastNext = true; backToStage(); });
  closeBtnS.addEventListener('click', backToStage);

  window.addEventListener('keydown', e=>{
    if(e.key==='Escape'){
      if(scrollWrap.classList.contains('on')){ closeScroll(); return; }
      if(reveal10.classList.contains('on')){ backToStage(); return; }
      if(reveal.classList.contains('on')){ seqList.length<=1 ? backToStage() : closeAll(); return; }
    }
    if((e.key===' '||e.key==='Enter') && reveal.classList.contains('on')){
      e.preventDefault();
      if(seqList.length<=1) backToStage(); else finishNow();
    }
  });

  /* ---------------- 作者有话说（卷轴） ----------------
     内容由 author-note.js 写入 window.__AUTHOR_NOTE__（gen.js 自动生成）。
     改文件 → node gen.js → 重新打开召唤页即可看到新内容。
     保留 fetch 兜底以应对历史部署/调试场景：file:// 双击时优先级看 window 全局，fetch 已不再必需。 */
  function openScroll(){
    scrollWrap.classList.add('on');
    scrollEl.classList.remove('open');                     // 先收拢，再下一帧摊开 → 每次都有开卷动画
    scrollBody.innerHTML = '<div style="text-align:center;color:#8a6a30;letter-spacing:.3em">展 卷 中 …</div>';
    requestAnimationFrame(()=>requestAnimationFrame(()=>scrollEl.classList.add('open')));
    // 优先用 author-note.js 注入的 window 全局（file:// 双击也能看，无需 fetch）
    const inline = (typeof window.__AUTHOR_NOTE__ === 'string') ? window.__AUTHOR_NOTE__ : null;
    if(inline){
      scrollBody.innerHTML = inline;
      return;
    }
    // 兜底：HTTP/部署场景可能在没有 author-note.js 的情况下被回退访问（比如调试期删了产物）
    fetch('author-note.html?t=' + Date.now(), {cache:'no-store'})
      .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(html => { scrollBody.innerHTML = html; })
      .catch(() => {
        scrollBody.innerHTML =
          '<h3>作 者 有 话 说</h3><p>卷轴内容加载失败：请确认项目根目录下存在 <code>author-note.js</code>（或 <code>author-note.html</code>）。</p>';
      });
  }
  function closeScroll(){
    if(!scrollWrap.classList.contains('on')) return;
    scrollEl.classList.remove('open');                     // 收卷动画
    setTimeout(()=> scrollWrap.classList.remove('on'), 480);
  }
  doll.addEventListener('click', ()=>{
    scrollWrap.classList.contains('on') ? closeScroll() : openScroll();
  });
  scrollWrap.addEventListener('click', e=>{ if(e.target === scrollWrap) closeScroll(); });
  document.getElementById('scrollClose').addEventListener('click', closeScroll);

  /* ---------------- 启动 ---------------- */
  Gacha.load().then(res=>{
    roster = res.roster; rates = res.rates;
    tiers  = buildTiersFor(pool);
    paintSegs();
    paintSummonBtn();
    // 卡池弹窗初始状态：自选立绘/概率行、保底倒计数、常驻统计、互斥选中态恢复
    paintPickFigure(); paintPickLine(); paintGuarantees(); paintUpStats();
    selUpTab = UP_TAB_BY_POOL[pool] || null;
    updateUpSelUI();
    if(!tiers.length){
      loading.innerHTML =
        `<div class="t">没 有 可 抽 取 的 角 色</div><div class="d">` +
        `请把图片放进 <code>img/&lt;稀有度&gt;/</code> 文件夹，并确保 <code>rates.json</code> 里该稀有度的 weight 大于 0。<br>` +
        `当前 rates.json 中的稀有度：${(rates.order||[]).join('、')}</div>`;
      return;
    }
    loading.style.display = 'none';
    requestAnimationFrame(resize);

    // 预载召唤音效，确保点击时能拿到真实 duration 来匹配过场时长
    try{ audioFor(SUMMON_SFX); }catch(e){}

    // 语音清单：拿不到也不影响抽卡，静默跳过
    Gacha.loadVoice().then(v=>{
      voiceMap  = v.map  || {};
      voiceBase = v.base || 'music/';
    }).catch(()=>{});
  }).catch(err=>{
    loading.innerHTML =
      `<div class="t">载 入 失 败</div><div class="d">` +
      `无法读取角色数据：<code>${err.message}</code><br><br>` +
      `请用本地静态服务或部署到网页空间打开（手机端用 PWA / 局域网访问；直接双击 file:// 也能玩，只是无法离线安装）<code>node server.js</code>，再访问 <code>http://127.0.0.1:8910</code></div>`;
  });

  /* 浮动粒子 */
  function spark(){
    const s = document.createElement('div');
    s.className='spark';
    s.style.left = (10+Math.random()*80)+'%';
    s.style.bottom='-10px';
    s.style.animationDuration=(4+Math.random()*5)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 9000);
  }
  setInterval(spark, 380);
})();
</script>

<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW 注册失败:', e.message));
    });
  }
</script>
