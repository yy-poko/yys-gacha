<!doctype html>
<html lang="zh-CN" data-page-node-id="BOiyIfQArPMysRPgw3zbGf">
<head data-page-node-id="SMWiuBcCZ2yzbt3vGLB2NW">
<meta charset="utf-8" data-page-node-id="bC0fGEgWcELuj78pP6fKaC">
<title>鼠鼠 · 召唤阵</title>
<link rel="icon" href="data:," data-page-node-id="lxLU676ftySj22HpbAX0cs">
<meta name="viewport" content="width=device-width,initial-scale=1" data-page-node-id="RSxILF6VgBUGOsDKO2oJNY">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#c8161d">
<style>
  :root{
    --gold:#f6c860; --gold-2:#ffe9a8; --red:#c8161d; --red-2:#ff5b66; --ink:#fff5dc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);
    font-family:"Noto Serif SC","STKaiti","KaiTi","Songti SC",serif;
    -webkit-user-select:none;user-select:none}
  body{background:radial-gradient(ellipse at 50% 55%, #3a0612 0%, #1a0408 35%, #07020a 75%, #000 100%)}

  /* 返回图鉴 */
  .back{
    position:fixed;left:20px;top:18px;z-index:20;
    color:#d6b67a;text-decoration:none;font-size:13px;letter-spacing:.15em;
    padding:7px 16px;border:1px solid rgba(246,200,96,.4);border-radius:999px;
    background:rgba(20,4,8,.5);backdrop-filter:blur(6px);transition:.15s;
  }
  .back:hover{color:#fff5dc;border-color:var(--gold);background:rgba(198,22,29,.35)}

  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:1200px}
  .top{position:absolute;top:16px;left:0;right:0;text-align:center;z-index:5;
    font-size:22px;letter-spacing:.4em;color:var(--gold-2);
    text-shadow:0 0 12px rgba(246,200,96,.6), 0 0 24px rgba(198,22,29,.45)}
  .top small{display:block;margin-top:5px;font-size:12px;letter-spacing:.3em;color:#a0876a;opacity:.85}

  .circle{position:relative;width:min(88vmin,760px);height:min(88vmin,760px);
    display:flex;align-items:center;justify-content:center}
  .circle svg{position:absolute;inset:0;width:100%;height:100%}
  .ring-rot{animation:spin 40s linear infinite;transform-origin:50% 50%}
  .ring-rot.rev{animation-direction:reverse;animation-duration:60s}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 符咒卡 */
  .talisman{position:absolute;width:74px;height:104px;border-radius:6px;
    background:linear-gradient(160deg,#fff5dc 0%,#f3d490 55%,#b8893a 100%);
    border:1px solid #6a4a1a;box-shadow:0 0 18px rgba(255,180,80,.45), inset 0 0 14px rgba(120,40,30,.35);
    color:#3a0508;display:flex;align-items:center;justify-content:center;font-weight:700;
    transform:translate(-50%,-50%);animation:float 6s ease-in-out infinite}
  .talisman::before{content:"";position:absolute;inset:6px;border:1px solid rgba(90,30,20,.4);border-radius:4px}
  .talisman span{position:relative;z-index:1;font-size:30px;text-shadow:0 1px 0 rgba(255,230,170,.6)}
  @keyframes float{0%,100%{transform:translate(-50%,-50%) translateY(0) rotate(var(--rot,0deg))}
    50%{transform:translate(-50%,-50%) translateY(-10px) rotate(calc(var(--rot,0deg) + 3deg))}}
  .talisman:nth-child(1){top:8%;left:50%;--rot:8deg}
  .talisman:nth-child(2){top:22%;left:84%;--rot:-12deg;animation-delay:-.7s}
  .talisman:nth-child(3){top:55%;left:96%;--rot:18deg;animation-delay:-1.4s}
  .talisman:nth-child(4){top:86%;left:78%;--rot:-7deg;animation-delay:-2.1s}
  .talisman:nth-child(5){top:95%;left:48%;--rot:6deg;animation-delay:-2.8s}
  .talisman:nth-child(6){top:84%;left:18%;--rot:-18deg;animation-delay:-3.5s}
  .talisman:nth-child(7){top:50%;left:2%;--rot:10deg;animation-delay:-4.2s}
  .talisman:nth-child(8){top:18%;left:14%;--rot:-4deg;animation-delay:-4.9s}

  .rose{position:absolute;width:120px;height:120px;transform:translate(-50%,-50%);
    opacity:.9;pointer-events:none;filter:drop-shadow(0 0 18px rgba(255,80,90,.5))}
  .rose.r1{top:6%;left:18%} .rose.r2{top:6%;right:8%;left:auto}
  .rose.r3{bottom:6%;left:10%} .rose.r4{bottom:6%;right:8%;left:auto}

  .draw-layer{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;z-index:4}

  .toolbar{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:7;
    display:flex;gap:10px;align-items:center;white-space:nowrap;
    background:rgba(20,4,8,.55);backdrop-filter:blur(8px);
    border:1px solid rgba(246,200,96,.35);border-radius:999px;padding:8px 12px}
  .swatch{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.4);cursor:pointer}
  .swatch.on{outline:2px solid var(--gold);outline-offset:2px}
  .toolbar button{background:linear-gradient(180deg,#c8161d,#7a0a10);color:#fff5dc;border:1px solid var(--gold);
    padding:8px 18px;border-radius:999px;cursor:pointer;font:inherit;letter-spacing:.15em;
    box-shadow:0 0 14px rgba(198,22,29,.6), inset 0 0 8px rgba(255,200,120,.4);transition:.12s}
  .toolbar button.ghost{background:transparent;color:var(--gold);border-color:rgba(246,200,96,.6)}
  .toolbar button:hover{transform:translateY(-1px);box-shadow:0 0 20px rgba(255,200,120,.7), 0 0 28px rgba(198,22,29,.7)}
  .toolbar .seg{display:flex;border:1px solid rgba(246,200,96,.5);border-radius:999px;overflow:hidden}
  .toolbar .seg button{background:transparent;border:none;border-radius:0;color:#d6b67a;
    padding:6px 14px;cursor:pointer;font:inherit;letter-spacing:.15em;box-shadow:none}
  .toolbar .seg button.on{background:linear-gradient(180deg,#c8161d,#7a0a10);color:#fff5dc}
  .toolbar .seg button:hover{transform:none;box-shadow:none;background:linear-gradient(180deg,#a01017,#600810);color:#fff5dc}
  /* 十周年期间锁定：玩家切不动，固定 十连+蓝票 */
  .toolbar .seg.locked{opacity:.55;pointer-events:none;cursor:default}
  /* 当前使用 UP 池时的状态牌（poolSeg 两个常规按钮都不亮，由它表明当前池子） */
  .up-chip{flex:none;padding:5px 12px;border-radius:999px;cursor:pointer;font:inherit;
    font-size:12.5px;font-weight:700;letter-spacing:.08em;
    background:linear-gradient(180deg,#ffefb3,#f6c860 55%,#a87422);color:#3a0508;
    border:1px solid #fff3cf;box-shadow:0 0 10px rgba(255,220,150,.6);
    animation:chipGlow 2.2s ease-in-out infinite;transition:transform .12s}
  .up-chip:hover{transform:translateY(-1px)}
  @keyframes chipGlow{
    0%,100%{box-shadow:0 0 8px rgba(255,220,150,.5)}
    50%{box-shadow:0 0 18px rgba(255,225,160,.95)}
  }

  /* 十周年特别版（仅一次）：金色高亮按钮 */
  .toolbar button.tenth{background:linear-gradient(180deg,#ffefb3,#f6c860 40%,#a87422);
    color:#3a0508;border-color:#fff3cf;
    box-shadow:0 0 18px rgba(255,220,150,.85), 0 0 36px rgba(198,22,29,.6), inset 0 -6px 0 rgba(90,51,8,.25);
    animation:tenthGlow 2.2s ease-in-out infinite}
  @keyframes tenthGlow{
    0%,100%{box-shadow:0 0 14px rgba(255,220,150,.6), 0 0 30px rgba(198,22,29,.45), inset 0 -6px 0 rgba(90,51,8,.25)}
    50%{box-shadow:0 0 26px rgba(255,230,170,.95), 0 0 50px rgba(255,120,90,.65), inset 0 -6px 0 rgba(90,51,8,.25)}
  }

  /* ===== 百羽凤凰火限时UP：花瓣入口按钮（顶部「召唤阵」标题右侧） ===== */
  .top-main{position:relative;display:inline-block}
  .petal-btn{position:absolute;left:calc(100% + 14px);top:-5px;
    width:38px;height:38px;padding:0;border:none;background:transparent;cursor:pointer;
    filter:drop-shadow(0 0 12px rgba(255,120,150,.5));animation:petalPulse 2.6s ease-in-out infinite;
    transition:transform .15s}
  .petal-btn:hover{transform:scale(1.12)}
  .petal-btn svg{display:block;width:100%;height:100%;pointer-events:none}
  @keyframes petalPulse{
    0%,100%{filter:drop-shadow(0 0 8px rgba(255,120,150,.4))}
    50%{filter:drop-shadow(0 0 20px rgba(255,140,165,.9))}
  }

  /* ===== 百羽凤凰火限时UP 弹窗 ===== */
  .up-wrap{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
  .up-wrap.on{display:flex;animation:fadeIn .25s ease}
  .up-modal{position:relative;width:min(90vw,410px);max-height:min(92vh,780px);overflow:auto;
    border-radius:14px;padding:16px 14px 16px;text-align:center;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,210,120,.18), transparent 55%),
      linear-gradient(180deg,#2a070c,#16030a 62%,#24060b);
    border:2px solid rgba(246,200,96,.8);
    box-shadow:inset 0 0 0 1px rgba(122,16,22,.9), inset 0 0 26px rgba(0,0,0,.6),
      0 0 0 4px rgba(246,200,96,.25), 0 18px 48px rgba(0,0,0,.7);
    animation:upPop .32s cubic-bezier(.2,.9,.3,1.18)}
  @keyframes upPop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  /* 弹窗背景立绘：限时UP页签时铺满整个弹窗（参考图样式），内容浮在上层 */
  .up-bg{position:absolute;inset:0;z-index:0;overflow:hidden;border-radius:12px;pointer-events:none}
  .up-bg[hidden]{display:none}
  .up-bg img{width:100%;height:100%;object-fit:contain;object-position:center 8%;
    filter:saturate(1.08)}
  /* 自下而上渐变：立绘上方不压暗，从靠近文字的下部开始压暗保证可读 */
  .up-bg::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(22,3,10,0) 0%, rgba(22,3,10,0) 40%,
      rgba(22,3,10,.42) 56%, rgba(22,3,10,.85) 68%, rgba(22,3,10,.97) 78%, #16030a 90%)}
  /* 自选模式已选角色：点背景立绘重新选择 */
  .up-bg.pick-sel{pointer-events:auto;cursor:pointer}
  .up-tabs,.up-pane,.up-prog,.up-pick{position:relative;z-index:1}
  .up-close{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;z-index:2;
    border:1px solid rgba(246,200,96,.7);background:rgba(20,4,8,.92);color:#ffe9a8;cursor:pointer;
    font-size:14px;line-height:1;font-family:inherit;transition:background .15s}
  .up-close:hover{background:rgba(198,22,29,.65)}
  /* 三个页签气泡：常驻 / 自选 / 限时 */
  .up-tabs{display:flex;gap:8px;justify-content:center;margin:2px 6px 12px}
  .up-tab{flex:1;max-width:108px;padding:6px 0;border-radius:999px;cursor:pointer;font:inherit;
    font-size:13.5px;font-weight:700;letter-spacing:.18em;text-indent:.18em;
    border:1px solid rgba(246,200,96,.5);background:rgba(20,4,8,.6);color:#c9ab72;
    transition:all .15s}
  .up-tab:hover{color:#ffe9a8;border-color:rgba(246,200,96,.8)}
  .up-tab.on{background:linear-gradient(180deg,#ffefb3,#f6c860 55%,#a87422);color:#3a0508;
    border-color:#fff3cf;box-shadow:0 0 10px rgba(255,220,150,.55)}
  /* 已选中的卡池页签：右上角金色 ✓ 角标（三池互斥，同一时间只有一个） */
  .up-tab{position:relative}
  .up-tab.sel::after{content:"✓";position:absolute;top:-7px;right:-2px;width:17px;height:17px;
    border-radius:50%;background:radial-gradient(circle at 50% 30%,#ffefb3,#f6c860 60%,#a87422);
    color:#3a0508;font-size:11px;font-weight:700;line-height:17px;text-indent:0;letter-spacing:0;
    border:1px solid #fff3cf;box-shadow:0 0 6px rgba(255,220,150,.7)}
  /* 未上线的限时UP：页签照常可点进来看，只是「选择卡池」按钮点不了 */
  .up-pick:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4);box-shadow:none}
  .up-pane[hidden]{display:none}
  /* 限时/自选（已选角色）：立绘已作弹窗背景，内容下移让上半部露出立绘（参考图构图） */
  .up-pane[data-pane="limited"],.up-pane[data-pane="pick"].with-bg{padding-top:min(26vh,210px)}
  /* 常驻：纯文字统计 */
  .up-stats{margin:18px 6px 22px;padding:14px 10px;border-radius:10px;
    background:rgba(0,0,0,.35);border:1px solid rgba(246,200,96,.35);
    color:#e8cf96;font-size:14px;letter-spacing:.08em;line-height:2.1}
  .up-stats b{color:#ffe9a8;font-size:16px;margin:0 2px}
  .up-stats .st-row{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 14px}
  /* 自选：立绘位置的「＋」按钮 */
  .up-figure-pick{position:relative}
  .up-add{width:100%;height:100%;min-height:200px;border:none;border-radius:8px;cursor:pointer;
    background:rgba(0,0,0,.3);color:#f6c860;font-size:64px;font-weight:300;font-family:inherit;
    line-height:1;transition:all .15s}
  .up-add:hover{background:rgba(246,200,96,.12);color:#ffefb3}
  .up-figure-pick img{cursor:pointer}   /* 点立绘重新选择角色 */
  /* 自选角色选择浮层 */
  .up-charlist{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;
    border-radius:14px;background:linear-gradient(180deg,#2a070c,#16030a 62%,#24060b)}
  .up-charlist[hidden]{display:none}
  .up-charlist-head{display:flex;align-items:center;justify-content:space-between;
    padding:12px 12px 8px;color:#f3d490;font-size:13.5px;letter-spacing:.08em}
  .up-charlist-head button{border:1px solid rgba(246,200,96,.6);border-radius:999px;
    background:transparent;color:#e8cf96;font:inherit;font-size:12.5px;padding:4px 14px;cursor:pointer}
  .up-charlist-head button:hover{background:rgba(246,200,96,.12)}
  .up-char-grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);
    gap:8px;padding:4px 12px 14px;align-content:start}
  .up-char-grid.dragging{cursor:grabbing;user-select:none}
  .up-char-grid{cursor:grab}
  .up-char-item{border:1px solid rgba(246,200,96,.4);border-radius:8px;background:rgba(0,0,0,.3);
    padding:6px 4px;cursor:pointer;text-align:center;transition:all .12s}
  .up-char-item:hover{border-color:#f6c860;background:rgba(246,200,96,.1)}
  .up-char-item img{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 4px}
  .up-char-item i{font-style:normal;font-size:11px;color:#d6b67a;display:block;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  /* 标题绶带：金字 + 两侧装饰线 */
  .up-banner{display:flex;align-items:center;gap:10px;margin:2px 6px 10px}
  .up-banner::before,.up-banner::after{content:"";flex:1;height:1px;
    background:linear-gradient(90deg,transparent,rgba(246,200,96,.75));}
  .up-banner::after{background:linear-gradient(90deg,rgba(246,200,96,.75),transparent)}
  .up-banner span{font-size:17px;font-weight:700;letter-spacing:.18em;text-indent:.18em;white-space:nowrap;
    background:linear-gradient(180deg,#ffefb3,#f6c860 55%,#d99a2b);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 14px rgba(246,200,96,.35)}
  /* 立绘：贴参考图中间大图 */
  .up-figure{position:relative;margin:2px 4px 10px;border-radius:10px;overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 72%, rgba(255,170,120,.22), transparent 70%),
      linear-gradient(180deg,#3a0d12,#1c040a)}
  .up-figure::after{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;
    border:1px solid rgba(246,200,96,.35)}
  .up-figure img{display:block;width:100%;height:min(32vh,250px);object-fit:contain;object-position:center bottom}
  .up-figure img[hidden]{display:none}   /* 作者 display:block 会盖掉 UA 的 [hidden]，显式补回 */
  /* 「46次召唤内必得 SSR/SP」红底横条 */
  .up-strip{margin:0 6px 7px;padding:7px 8px;border-radius:8px;
    background:linear-gradient(180deg,#c8161d,#7a0a10);border:1px solid rgba(246,200,96,.6);
    color:#ffe9a8;font-size:14px;letter-spacing:.08em;
    box-shadow:0 0 12px rgba(198,22,29,.5), inset 0 0 8px rgba(255,200,120,.28)}
  .up-strip b{margin-left:5px;font-size:15px;color:#fff3cf;text-shadow:0 0 8px rgba(255,220,150,.6)}
  /* 概率UP行 */
  .up-rate{margin:0 6px 12px;font-size:13.5px;letter-spacing:.1em;color:#f3d490}
  .up-rate b{margin-left:3px;font-size:15px;color:#ffe9a8;text-shadow:0 0 10px rgba(255,220,150,.55)}
  /* 抽数进度条：整条「刻度尺」比可视区宽，左右拖动平移查看（玩家真实抽数标记不可拖） */
  .up-prog{position:relative;margin:0 6px 12px}
  .up-prog-tip{text-align:center;font-size:12.5px;letter-spacing:.1em;color:#f3d490;margin:0 6px 8px}
  /* 可视窗口（overflow 裁掉尺子超宽部分）；尺子宽度由 JS 按 450 档设置。
     高度 92px：顶部 22px 留给「当前抽数」气泡，下方轨道 + 刻度 */
  .up-prog-zone{position:relative;height:92px;overflow:hidden;cursor:grab;touch-action:none}
  .up-prog-zone:active{cursor:grabbing}
  .up-scale{position:absolute;left:0;top:0;height:100%;will-change:transform}
  /* 轨道：左侧内缩 10px，右侧 22px（给 450 刻度标签留出完整显示空间） */
  .up-track{position:absolute;left:10px;right:22px;top:30px;height:10px;border-radius:5px;
    background:#1a0806;border:1px solid rgba(246,200,96,.55);overflow:visible}
  .up-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;
    background:linear-gradient(180deg,#ffefb3,#f6c860 55%,#c98f2e);width:0}
  .up-handle{position:absolute;top:50%;transform:translate(-50%,-50%);left:0;width:20px;height:20px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff7dd, #f6c860 60%, #b8893a);
    border:2px solid #fff3cf;box-shadow:0 0 10px rgba(255,220,150,.8);pointer-events:none;z-index:3}
  /* 当前抽数气泡：悬在金色滑块正上方，带下指小尾巴 */
  .up-cur{position:absolute;top:0;transform:translateX(-50%);padding:2px 9px;border-radius:999px;
    background:linear-gradient(180deg,#ffefb3,#f6c860 60%,#c98f2e);color:#3a0508;
    font-size:11px;font-weight:700;letter-spacing:.05em;white-space:nowrap;pointer-events:none;z-index:4;
    border:1px solid #fff3cf;box-shadow:0 0 8px rgba(255,220,150,.65)}
  .up-cur::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:#e9b84f;border-bottom:none}
  /* 刻度：抽数 + 对应UP概率 */
  .up-ticks{position:absolute;left:10px;right:22px;top:46px;height:44px;pointer-events:none}
  .up-tick{position:absolute;top:0;transform:translateX(-50%);text-align:center;line-height:1.25}
  .up-tick b{display:block;font-size:12.5px;color:#f6c860;font-weight:700}
  .up-tick i{display:block;font-style:normal;font-size:10.5px;color:#d6b67a}
  .up-tick::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    width:1.5px;height:4px;background:rgba(246,200,96,.6)}
  /* 选择卡池：主行动按钮 */
  .up-pick{display:block;width:calc(100% - 12px);margin:0 auto;padding:11px 0;border-radius:999px;cursor:pointer;
    font:inherit;font-size:15px;font-weight:700;letter-spacing:.3em;text-indent:.3em;
    background:linear-gradient(180deg,#ffefb3,#f6c860 40%,#a87422);color:#3a0508;
    border:1px solid #fff3cf;
    box-shadow:0 0 14px rgba(255,220,150,.55), inset 0 -5px 0 rgba(90,51,8,.25);
    transition:transform .12s, box-shadow .15s}
  .up-pick:hover{transform:translateY(-1px);box-shadow:0 0 22px rgba(255,225,160,.8), inset 0 -5px 0 rgba(90,51,8,.25)}
  .up-pick:active{transform:translateY(1px)}
  .up-pick.done{background:linear-gradient(180deg,#c8161d,#7a0a10);color:#fff5dc;border-color:rgba(246,200,96,.7)}

  @media (max-width: 720px){
    .petal-btn{width:32px;height:32px;top:-3px;left:calc(100% + 9px)}
    .up-modal{width:min(94vw,400px)}
    .up-figure img{height:24vh}
  }

  /* 中央落笔召唤按钮已删除（召唤阵在窄屏上下都要让出空间，否则会盖住召阵图） */
  @media (max-width: 720px){
    /* 让召阵整体缩小，往顶部压紧，给工具栏和按钮留足空间 */
    .circle{
      width:min(60vmin,300px);height:min(60vmin,300px);
      margin-top:6vh
    }
    /* 缩小符咒：让它散布在召阵边缘而不是堆在中心（vmin 自适应） */
    .talisman{width:13vmin;height:18vmin;min-width:48px;min-height:68px}
    .talisman span{font-size:5.6vmin}
    /* 把花往 viewport 角落推开，不被召阵吃掉 */
    .rose{width:18vmin;height:18vmin;min-width:72px;min-height:72px}
    .rose.r1{top:1%;left:3%} .rose.r2{top:1%;right:3%}
    .rose.r3{bottom:34vh;left:3%} .rose.r4{bottom:34vh;right:3%}
    /* 工具栏紧凑化：允许换行居中，避免一组按钮在窄屏一整行溢出被裁 */
    .toolbar{left:8px;right:8px;bottom:max(12px, env(safe-area-inset-bottom));
      transform:none;                          /* 清掉桌面版 translateX(-50%)，否则 left/right 定位会错位 */
      border-radius:16px;gap:6px;row-gap:6px;padding:6px 8px;
      flex-wrap:wrap;justify-content:center}
    .toolbar button{padding:5px 10px;font-size:13px}
    .toolbar .seg button{padding:4px 8px;font-size:12.5px;letter-spacing:.05em}
    .swatch{width:20px;height:20px}
    /* 顶部标题缩小 */
    .top{font-size:22px;letter-spacing:.18em;margin-top:8px}
    .top small{font-size:11px;letter-spacing:.12em}
    /* 返回按钮小一点，避开 status bar */
    .back{left:10px;top:max(10px, env(safe-area-inset-top));font-size:12px;padding:6px 12px}
    /* 纸人 icon 收缩 */
    .doll{width:42px;top:max(10px, env(safe-area-inset-top));right:12px}
    /* 召唤阵光效缩小 */
    .fx-circle{width:min(56vmin,300px);height:min(56vmin,300px)}
    .fx-glow{width:40vmin;height:40vmin}
  }

  /* 手机竖屏：左侧名字牌会遮挡居中的角色立绘，改为顶部居中显示在角色上方 */
  @media (max-width: 720px) and (orientation: portrait){
    .scene-name{
      left:50%;
      top:max(8vh, 50px);
      transform:translate(-50%, 0);
      align-items:center;
      padding:10px 18px 12px;
      text-align:center;
      background:linear-gradient(180deg, rgba(40,6,12,.92) 0%, rgba(40,6,12,.55) 80%, transparent 100%);
      border-left:none;
      border-top:3px solid var(--gold);
      border-radius:0 0 10px 10px
    }
    .scene-name.in{transform:translate(-50%, 0)}
    .scene-name .badge,
    .scene-name .nm,
    .scene-name .new{align-self:center}
    .scene-name .nm{font-size:22px;letter-spacing:.25em}
    .scene-name .badge{font-size:11px;padding:2px 9px}
    .scene-name .new{margin-top:3px}
  }

  /* 比 720 更窄：更猛的小屏幕（iPhone SE 之类 320~375 宽） */
  @media (max-width: 420px){
    .circle{width:min(72vmax,300px);height:min(72vmax,300px);margin-top:2vh}
    .talisman{width:46px;height:64px}
    .talisman span{font-size:22px}
    .talisman:nth-child(8){left:8%;top:30%}  /* 调整分布防止拥挤 */
    .top{font-size:20px}
  }

  /* ===== 右上角小纸人 · 作者有话说 ===== */
  .doll{position:fixed;top:14px;right:18px;z-index:30;width:52px;cursor:pointer;
    filter:drop-shadow(0 0 10px rgba(255,200,120,.35));transition:transform .2s, filter .2s}
  .doll img{display:block;width:100%;pointer-events:none}
  .doll:hover{transform:scale(1.08) rotate(-3deg);filter:drop-shadow(0 0 16px rgba(255,220,150,.9))}
  .doll .tip{position:absolute;top:50%;right:calc(100% + 14px);transform:translateY(-50%) translateX(8px);
    white-space:nowrap;padding:8px 16px;border-radius:999px;border:1px solid rgba(246,200,96,.5);
    background:rgba(20,4,8,.92);color:#ffe9a8;font-size:12px;letter-spacing:.25em;
    opacity:0;pointer-events:none;transition:.22s}
  .doll:hover .tip{opacity:1;transform:translateY(-50%) translateX(0)}

  /* ===== 卷轴：从左往右摊开 ===== */
  .scroll-wrap{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
  .scroll-wrap.on{display:flex;animation:fadeIn .3s ease}
  .scroll{position:relative;display:flex;align-items:stretch;
    filter:drop-shadow(0 16px 44px rgba(0,0,0,.65))}
  .scroll-rod{width:20px;border-radius:10px;position:relative;flex:none;
    background:linear-gradient(180deg,#a87422,#5a380f 60%,#7a4c16);
    box-shadow:inset 0 0 8px rgba(0,0,0,.6)}
  .scroll-rod::before,.scroll-rod::after{content:'';position:absolute;left:50%;transform:translateX(-50%);
    width:28px;height:13px;border-radius:7px;background:linear-gradient(180deg,#f6c860,#8a5a20)}
  .scroll-rod::before{top:-8px}
  .scroll-rod::after{bottom:-8px}
  .scroll-paper{width:0;overflow:hidden;transition:width 1s cubic-bezier(.25,.85,.3,1);
    background:linear-gradient(180deg,#f7ecd0,#efdba8);
    border-top:4px solid #7a4c16;border-bottom:4px solid #7a4c16}
  .scroll.open .scroll-paper{width:min(78vw,760px)}
  .scroll-paper .inner{width:min(78vw,760px);padding:32px 44px;color:#4a2c0a;
    font-size:15px;line-height:2.1;letter-spacing:.06em;
    max-height:min(70vh,560px);overflow:auto;-webkit-user-select:text;user-select:text}
  .scroll-paper .inner h3{margin:0 0 16px;text-align:center;font-size:20px;letter-spacing:.5em;
    color:#7a1016;font-weight:700;text-indent:.5em}
  .scroll-paper .inner p{margin:0 0 12px}
  .scroll-paper .inner code{background:rgba(122,16,22,.08);padding:2px 7px;border-radius:4px;color:#7a1016}
  .scroll-close{position:absolute;top:-18px;right:-18px;width:36px;height:36px;border-radius:50%;
    border:1px solid rgba(246,200,96,.7);background:rgba(20,4,8,.92);color:#ffe9a8;cursor:pointer;
    font-size:15px;line-height:1;font-family:inherit;display:none;z-index:2}
  .scroll-wrap.on .scroll-close{display:block}
  .scroll-close:hover{background:rgba(198,22,29,.6)}

  /* ===== 结果场景：依次登场、渐隐移出 ===== */
  .reveal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    flex-direction:column;overflow:hidden;
    background:radial-gradient(ellipse at 50% 70%, rgba(120,8,24,.55) 0%, rgba(8,2,8,.95) 55%, #050108 100%);
    backdrop-filter:blur(3px)}
  .reveal.on{display:flex;animation:fadeIn .5s ease forwards}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .scene{position:relative;width:100%;height:100%;overflow:hidden}
  .scene-bg{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse 60% 18% at 50% 78%, rgba(255,200,120,.18), transparent 70%),
      radial-gradient(circle at 12% 18%, rgba(255,255,255,.5) 0 1px, transparent 1.5px),
      radial-gradient(circle at 28% 32%, rgba(255,230,180,.4) 0 1px, transparent 1.5px),
      radial-gradient(circle at 55% 8%,  rgba(255,255,255,.5) 0 1px, transparent 1.5px),
      radial-gradient(circle at 78% 22%, rgba(255,220,160,.4) 0 1px, transparent 1.5px),
      radial-gradient(circle at 88% 38%, rgba(255,255,255,.35) 0 1px, transparent 1.5px),
      radial-gradient(circle at 8%  55%, rgba(255,210,140,.3) 0 1px, transparent 1.5px),
      radial-gradient(circle at 42% 48%, rgba(255,255,255,.25) 0 1px, transparent 1.5px),
      radial-gradient(circle at 70% 60%, rgba(255,220,160,.3) 0 1px, transparent 1.5px),
      radial-gradient(circle at 18% 78%, rgba(255,200,140,.25) 0 1px, transparent 1.5px),
      radial-gradient(circle at 65% 85%, rgba(255,200,140,.2) 0 1px, transparent 1.5px),
      linear-gradient(180deg,#0a0208 0%,#150410 50%,#1a0612 100%);
    background-size:100% 100%,200px 200px,240px 220px,180px 180px,220px 240px,260px 260px,
      200px 220px,280px 260px,240px 200px,220px 240px,200px 220px,100% 100%;
    background-repeat:no-repeat,repeat,repeat,repeat,repeat,repeat,repeat,repeat,repeat,repeat,repeat,no-repeat}
  .scene-chars{position:absolute;inset:0;pointer-events:none}
  .scene-char{position:absolute;left:50%;top:50%;
    transform-origin:center bottom;opacity:0;will-change:transform,opacity}
  .scene-char.enter{transform:translate(-50%,calc(-50% + 80px)) scale(.9);transition:none}
  .scene-char.in{opacity:1;transform:translate(-50%,-50%) scale(1);
    transition:opacity .55s ease, transform .7s cubic-bezier(.16,.84,.35,1)}
  .scene-char.out{opacity:0;transform:translate(calc(-50% - 80vw),-50%) scale(.94);
    transition:opacity .6s ease, transform .9s cubic-bezier(.42,0,.7,.4)}
  .scene-char img{display:block;width:auto;height:auto;
    max-width:min(84vmin,800px);
    /* 底部预留约 115px 给进度点/计数/按钮；瘦高人形刚好不越线 */
    max-height:calc(100vh - 165px);
    filter:drop-shadow(0 0 18px rgba(255,200,120,.5)) drop-shadow(0 0 34px rgba(198,22,29,.4));
    /* 立绘没加载完时显示微光骨架，加载完淡入，避免空白/闪烁 */
    opacity:0;transition:opacity .45s ease;
    background:linear-gradient(110deg, rgba(255,255,255,.04) 28%, rgba(255,225,150,.13) 50%, rgba(255,255,255,.04) 72%);
    background-size:220% 100%;animation:skel 1.2s linear infinite}
  .scene-char img.loaded{opacity:1;animation:none;background:none}
  @keyframes skel{from{background-position:220% 0}to{background-position:-220% 0}}
  .scene-name{position:absolute;left:6%;top:50%;transform:translate(-45%,-50%);
    display:flex;flex-direction:column;gap:8px;padding:14px 24px 14px 18px;
    background:linear-gradient(90deg, rgba(40,6,12,.85), rgba(40,6,12,.55) 80%, transparent);
    border-left:3px solid var(--gold);border-radius:0 8px 8px 0;opacity:0;
    transition:opacity .45s ease, transform .6s cubic-bezier(.16,.84,.35,1);z-index:30}
  .scene-name.in{opacity:1;transform:translate(0,-50%)}
  .scene-name .badge{display:inline-block;padding:3px 10px;border-radius:5px;
    color:#2a0a06;font-size:12px;letter-spacing:.2em;font-weight:700;align-self:flex-start}
  /* SSR/SP 专属黑幕里的立绘：同样先骨架占位，加载完淡入 */
  #srImg{opacity:0;
    background:linear-gradient(110deg, rgba(255,255,255,.04) 28%, rgba(255,225,150,.13) 50%, rgba(255,255,255,.04) 72%);
    background-size:220% 100%;animation:skel 1.2s linear infinite}
  /* 只收掉骨架微光，绝不能在这里写 opacity:1 —— #srImg.loaded(1,1,0) 会压过
     #srFx img{opacity:0}(1,0,1)，立绘一加载完就直接显示，「先全黑再浮现」这一拍就没了。
     可见性只由 #srFx img / #srFx img.in 管（黑幕 650ms 后才加 .in 渐现）。 */
  #srImg.loaded{animation:none;background:none}
  .scene-name .nm{font-size:28px;letter-spacing:.35em;color:var(--gold-2);
    text-shadow:0 0 14px rgba(255,200,120,.7), 0 0 28px rgba(198,22,29,.5)}
  .scene-name .new{
    align-self:flex-start;margin-top:2px;padding:2px 8px;border-radius:4px;
    background:linear-gradient(180deg,#ff5b66,#8a0a12);color:#fff;
    font-size:11px;letter-spacing:.15em;animation:newPop .5s ease}
  @keyframes newPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}

  .seq-bar{position:absolute;left:0;right:0;bottom:30px;z-index:40;
    display:flex;flex-direction:column;align-items:center;gap:12px}
  .seq-dots{display:flex;gap:7px}
  .seq-dots i{width:7px;height:7px;border-radius:50%;background:rgba(246,200,96,.22);transition:.3s}
  .seq-dots i.on{background:var(--gold);transform:scale(1.4);box-shadow:0 0 8px var(--gold)}
  .seq-dots i.done{background:rgba(246,200,96,.55)}
  .seq-progress{font-size:14px;letter-spacing:.35em;color:#d6b67a;text-shadow:0 0 10px rgba(0,0,0,.9)}
  .seq-actions{display:flex;gap:14px}
  .seq-actions button{background:transparent;color:var(--gold);border:1px solid var(--gold);
    padding:8px 22px;border-radius:999px;cursor:pointer;font:inherit;letter-spacing:.2em;transition:.15s}
  .seq-actions button:hover{background:rgba(246,200,96,.15)}
  .seq-actions button.primary{background:linear-gradient(180deg,#c8161d,#7a0a10);color:#fff;border-color:var(--gold)}
  .seq-actions button.hide{display:none}

  /* SSR/SP 专属落场：渐变黑屏 → 立绘渐现 → 上升光点 → 播语音。
     层级：盖过普通立绘(scene-chars auto)，让名牌(z30)/进度条按钮(z40)浮在黑幕上 */
  #srFx{position:absolute;inset:0;z-index:20;background:#020104;opacity:0;
    transition:opacity .6s ease;pointer-events:none;overflow:hidden}
  #srFx.on{opacity:1}
  #srSparks{position:absolute;inset:0}
  #srSparks .spark{bottom:-10px}   /* 复用召唤阵同款 .spark 光点 + rise 动画 */
  #srFx img{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
    max-width:min(84vmin,800px);max-height:calc(100vh - 165px);
    opacity:0;transition:opacity .8s ease;
    filter:drop-shadow(0 0 18px rgba(255,200,120,.5)) drop-shadow(0 0 34px rgba(198,22,29,.4))}
  #srFx img.in{opacity:1}
  /* 黑幕那一段要「全屏纯黑」：底部进度点/进度数字与跳过·再画一次·收起按钮
     （seq-bar z40 / seqSingle z30）本就浮在黑幕(z20)之上，会露在黑底上破坏效果，
     所以黑幕期间一并隐去，立绘渐现时（名牌出来同时）再淡回来。 */
  .seq-bar,#seqSingle{transition:opacity .4s ease}
  #reveal.sr-black .seq-bar,
  #reveal.sr-black #seqSingle{opacity:0;visibility:hidden;pointer-events:none}

  /* 十连召唤 · 阵容页（替代小卡片网格） */
  .lu-row{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:center;
    margin-top:3vh;max-width:100vw;padding:0 8px}
  .lu-slot{position:relative;margin:0 -12px;flex:0 0 auto;z-index:var(--lu-z,1);
    opacity:0;animation:luIn .55s cubic-bezier(.16,.84,.35,1) forwards;
    animation-delay:var(--lu-delay,0ms)}
  @keyframes luIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
  .lu-slot img{display:block;width:var(--lu-w,9vw);height:auto;
    max-height:58vh;object-fit:contain;
    filter:drop-shadow(0 0 14px rgba(255,200,120,.5)) drop-shadow(0 0 30px rgba(198,22,29,.4))}
  .lu-banner{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:5px;
    padding:8px 6px 10px;border-radius:5px 5px 9px 9px;
    background:linear-gradient(180deg, var(--lu-c,#c8161d) 0%, rgba(30,5,10,.92) 70%);
    border:1px solid rgba(255,235,190,.55);
    box-shadow:0 0 14px rgba(0,0,0,.65), inset 0 0 8px rgba(255,220,150,.25)}
  .lu-banner .rb{font-size:11px;font-weight:700;color:#fff5dc;background:rgba(0,0,0,.3);
    padding:1px 6px;border-radius:4px;letter-spacing:.06em;white-space:nowrap}
  .lu-banner .rn{writing-mode:vertical-rl;font-size:13px;letter-spacing:.14em;
    color:#ffe9a8;max-height:150px;text-shadow:0 0 6px rgba(0,0,0,.85)}
  .lu-new{position:absolute;top:6%;right:6%;z-index:5;padding:2px 8px;border-radius:4px;
    background:linear-gradient(180deg,#ff5b66,#8a0a12);color:#fff;font-size:11px;
    letter-spacing:.12em;animation:newPop .5s ease}
  .lu-title{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);z-index:20;
    font:700 48px/1 "STKaiti","KaiTi","Noto Serif SC",serif;letter-spacing:.16em;white-space:nowrap;
    background:linear-gradient(180deg,#ffefb3 0%,#f6c860 45%,#a87422 90%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 16px rgba(255,200,120,.85)) drop-shadow(0 3px 5px rgba(60,10,5,.9))}
  /* 结算页操作按钮：再次绘制 / 收起 */
  .lu-actions{position:absolute;left:0;right:0;bottom:24px;z-index:30;
    display:flex;justify-content:center;gap:16px}
  .lu-actions button{background:transparent;color:var(--gold);border:1px solid var(--gold);
    padding:9px 26px;border-radius:999px;cursor:pointer;font:inherit;font-size:15px;
    letter-spacing:.25em;text-indent:.25em;transition:.15s}
  .lu-actions button:hover{background:rgba(246,200,96,.15);transform:translateY(-1px)}
  .lu-actions button.primary{background:linear-gradient(180deg,#c8161d,#7a0a10);color:#fff;border-color:var(--gold)}
  /* 十连结果页：角色阵容 → 标题 → 按钮 三段改成流内排列并整体垂直居中，
     避免 default 的 reveal justify-content:center + title/actions 绝对定位沉底产生巨大空隙 */
  #reveal10{justify-content:center;padding-top:0}
  #reveal10 .lu-row{margin-top:0;max-height:52vh}
  #reveal10 .lu-title{position:static;transform:none;margin-top:10px;font-size:44px;
    letter-spacing:.2em}
  #reveal10 .lu-actions{position:static;margin-top:32px;
    padding-bottom:max(18px, env(safe-area-inset-bottom))}
  /* 手机端十连结果页（须在 .lu-slot / .lu-title 等基础规则之后，否则同优先级被覆盖） */
  @media (max-width: 720px){
    #reveal10 .lu-row{max-height:48vh}
    /* 放大角色 + 更大负 margin 重叠 → 既够大又不溢出视口 */
    .lu-slot{margin:0 -22px}
    .lu-slot img{width:calc(var(--lu-w,9vw) * 1.8);max-height:42vh}
    #reveal10 .lu-title{font-size:37px;margin-top:6px}
    #reveal10 .lu-actions{margin-top:24px}
    #reveal10 .lu-actions button{padding:8px 22px;font-size:14px}
  }
  /* 「点击继续」通用底部提示（十连阵容页 / 单抽页共用） */
  .click-continue{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:30;
    padding:9px 36px;border:1px solid rgba(246,200,96,.55);border-radius:999px;
    color:#ffe9a8;font-size:15px;letter-spacing:.4em;text-indent:.4em;white-space:nowrap;
    background:rgba(20,4,8,.6);animation:hintPulse 1.8s ease-in-out infinite;
    pointer-events:none;text-shadow:0 0 10px rgba(0,0,0,.9)}
  @keyframes hintPulse{0%,100%{opacity:.5}50%{opacity:1}}

  /* 召唤时的「关门开门」过场（替代刺眼的白屏闪烁） */
  .door{position:fixed;inset:0;z-index:60;pointer-events:none;display:flex;overflow:hidden}
  .door-panel{position:absolute;top:0;bottom:0;width:50%;
    background:linear-gradient(180deg,#250507,#5e0d12 45%,#33080b);
    box-shadow:inset 0 0 80px rgba(0,0,0,.7);
    transition:transform .55s cubic-bezier(.76,0,.24,1)}
  .door-panel.left{left:0;transform:translateX(-100%)}
  .door-panel.right{right:0;transform:translateX(100%)}
  .door-panel::after{content:'';position:absolute;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,#f6c860,#fff3cf,#f6c860);opacity:.85}
  .door-panel.left::after{right:0}
  .door-panel.right::after{left:0}
  .door.closing .door-panel.left,
  .door.closing .door-panel.right{transform:translateX(0)}
  .door.opening .door-panel.left{transform:translateX(-100%)}
  .door.opening .door-panel.right{transform:translateX(100%)}

  .spark{position:absolute;width:6px;height:6px;border-radius:50%;
    background:radial-gradient(circle,#fff7c8 0%,#f6c860 50%,transparent 70%);
    box-shadow:0 0 10px #f6c860,0 0 18px rgba(255,200,120,.6);
    animation:rise 7s linear infinite;opacity:0}
  @keyframes rise{0%{transform:translateY(0) scale(.4);opacity:0}10%{opacity:1}
    90%{opacity:.6}100%{transform:translateY(-120vh) scale(1);opacity:0}}

  .state{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
    gap:14px;background:rgba(8,2,8,.95);z-index:99;text-align:center;padding:30px}
  .state .t{font-size:19px;letter-spacing:.3em;color:var(--gold)}
  .state .d{font-size:13px;letter-spacing:.1em;color:#a08a6c;line-height:2;max-width:560px}

  /* === 召唤阵注入光效（红瓣 + 金光屑）· 不满意可整体删除：
